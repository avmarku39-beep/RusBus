            ROUTE_STOPS.forEach((stop) => {
                const pZone = roadPoint(stop.z, HALF_ROAD - 1.8);
                const zoneMat = new THREE.MeshBasicMaterial({
                    map: Textures.busStopZone,
                    transparent: true,
                    depthWrite: false
                });
                const zoneMesh = new THREE.Mesh(zoneGeo, zoneMat);
                zoneMesh.rotation.x = -Math.PI / 2;
                zoneMesh.rotation.z = pZone.angle;
                zoneMesh.position.set(pZone.x, 0.035, pZone.z);
                scene.add(zoneMesh);

                const pShelter = roadPoint(stop.z, HALF_ROAD + 2.3);
                const shelter = new THREE.Group();
                const roof = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.16, 5.4), frameMat);
                roof.position.y = 2.85;
                const back = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.6, 5.1), glassMat);
                back.position.set(0.85, 1.45, 0);
                const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.8, 0.12), frameMat);
                p1.position.set(0.85, 1.4, -2.5);
                const p2 = p1.clone();
                p2.position.z = 2.5;
                const bench = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.42, 3.2), benchMat);
                bench.position.set(0.45, 0.45, 0);

                const signTex = createStopSignTexture(stop.name);
                const sign = new THREE.Mesh(
                    new THREE.PlaneGeometry(2.5, 0.92),
                    new THREE.MeshBasicMaterial({ map: signTex, side: THREE.DoubleSide })
                );
                sign.position.set(-0.3, 3.45, 2.3);

                shelter.add(roof, back, p1, p2, bench, sign);
                shelter.position.set(pShelter.x, 0.18, pShelter.z);
                shelter.rotation.y = pShelter.angle;
                scene.add(shelter);

                const passengers = [];
                for (let k = 0; k < stop.waiting; k++) {
                    const person = new THREE.Group();
                    const torso = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.2, 0.25, 1.08, 7),
                        new THREE.MeshLambertMaterial({ color: coatPalette[(k + stop.id) % coatPalette.length] })
                    );
                    torso.position.y = 0.78;
                    const head = new THREE.Mesh(
                        new THREE.SphereGeometry(0.19, 7, 7),
                        new THREE.MeshLambertMaterial({ color: 0xfde68a })
                    );
                    head.position.y = 1.52;
                    person.add(torso, head);

                    const pLat = HALF_ROAD + 1.0 + (k % 2) * 0.65;
                    const pZ = stop.z - 2.4 + Math.floor(k / 2) * 1.15;
                    const pos = roadPoint(pZ, pLat);
                    person.position.set(pos.x, 0.18, pos.z);
                    scene.add(person);

                    passengers.push({
                        mesh: person,
                        homeX: pos.x,
                        homeZ: pos.z,
                        boarding: false,
                        boarded: false
                    });
                }

                stopEntries.push({ stop, zoneMesh, passengers });
            });
        }

            const cRing = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.036, 8, 22), darkMat);
            const cSpoke = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.05, 0.04), new THREE.MeshLambertMaterial({ color: 0x475569 }));
            const cMark = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 0.05), yellowMat);
            cMark.position.y = 0.28;
            cabinWheelMesh.add(cRing, cSpoke, cMark);
            cabinWheelMesh.position.set(-0.68, 1.84, -L * 0.5 + 0.84);
            cabinWheelMesh.rotation.x = -Math.PI / 3.1;
            busChassis.add(cabinWheelMesh);

            // Салон: сиденья и жёлтые поручни (видны, если оглянуться назад в кабине!)
            const seatMat = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
            const railMat = new THREE.MeshLambertMaterial({ color: 0xfacc15 });
            for (let sz = -2.2; sz <= 4.1; sz += 1.25) {
                // Левый ряд сидений
                const sL = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.55, 0.52), seatMat);
                sL.position.set(-0.78, 1.15, sz);
                const backL = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.58, 0.12), seatMat);
                backL.position.set(-0.78, 1.55, sz + 0.22);
                busChassis.add(sL, backL);

                // Правый ряд (где нет дверей)
                if (sz > 1.2 || (sz > -2.5 && sz < -0.6)) {
                    const sR = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.55, 0.52), seatMat);
                    sR.position.set(0.78, 1.15, sz);
                    const backR = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.58, 0.12), seatMat);
                    backR.position.set(0.78, 1.55, sz + 0.22);
                    busChassis.add(sR, backR);
                }
            }
            // Продольные верхние и вертикальные жёлтые поручни
            [-0.45, 0.45].forEach(rx => {
                const topRail = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 7.6, 6), railMat);
                topRail.rotation.x = Math.PI / 2;
                topRail.position.set(rx, 2.74, 0.8);
                busChassis.add(topRail);
            });
            [-2.4, -0.5, 1.5, 3.6].forEach(pz => {
                const vRail = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 2.1, 6), railMat);
                vRail.position.set(-0.45, 1.72, pz);
                busChassis.add(vRail);
            });
            // Потолочные плафоны освещения салона
            [-1.8, 0.8, 3.2].forEach(lz => {
                const lamp = new THREE.Mesh(
                    new THREE.BoxGeometry(0.55, 0.04, 1.1),
                    new THREE.MeshBasicMaterial({ color: 0xfef9c3 })
                );
                lamp.position.set(0, 2.93, lz);
                busChassis.add(lamp);
            });

            // Передние фары
            const headMat = new THREE.MeshBasicMaterial({ color: 0xfffbeb });
            [-0.92, 0.92].forEach(hx => {
                const hl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.22, 0.08), headMat);
                hl.position.set(hx, 0.96, -L * 0.5 - 0.02);
                busChassis.add(hl);
            });

            // Стоп-сигналы и фонари заднего хода
            [-0.95, 0.95].forEach(rx => {
                const bMat = new THREE.MeshBasicMaterial({ color: 0x7f1d1d });
                const brakeL = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.22, 0.08), bMat);
                brakeL.position.set(rx, 1.05, L * 0.5 + 0.02);
                busChassis.add(brakeL);
                brakeLightMats.push(bMat);

                const rMat = new THREE.MeshBasicMaterial({ color: 0x475569 });
                const revL = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.16, 0.08), rMat);
                revL.position.set(rx * 0.65, 0.8, L * 0.5 + 0.02);
                busChassis.add(revL);
                reverseLightMats.push(rMat);
            });

            // Колёса крепятся прямо к busGroup (остаются на асфальте при работе подвески)
            const tireGeo = new THREE.CylinderGeometry(0.54, 0.54, 0.36, 14);
            tireGeo.rotateZ(Math.PI / 2);
            const rimGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.38, 10);
            rimGeo.rotateZ(Math.PI / 2);
            const tireMat = new THREE.MeshLambertMaterial({ color: 0x171717 });
            const rimMat = new THREE.MeshLambertMaterial({ color: 0xcbd5e1 });

            [
                { x: -W * 0.5 + 0.05, z: -3.25, front: true },
                { x:  W * 0.5 - 0.05, z: -3.25, front: true },
                { x: -W * 0.5 + 0.05, z:  3.0,  front: false },
                { x:  W * 0.5 - 0.05, z:  3.0,  front: false }
            ].forEach(w => {
                const pivot = new THREE.Group();
                pivot.position.set(w.x, 0.54, w.z);
                const roller = new THREE.Group();
                roller.add(new THREE.Mesh(tireGeo, tireMat), new THREE.Mesh(rimGeo, rimMat));
                pivot.add(roller);
                busGroup.add(pivot);
                allWheelRollMeshes.push(roller);
                if (w.front) frontWheelPivots.push(pivot);
            });

            busGroup.position.set(state.bus.x, 0, state.bus.z);
            busGroup.rotation.y = state.bus.angle;
            scene.add(busGroup);
        }

        function buildTraffic() {
            const colors = [0xf8fafc, 0x3b82f6, 0xef4444, 0x64748b, 0xf59e0b, 0x1e293b];
            const bodyGeo = new THREE.BoxGeometry(1.88, 0.72, 4.2);
            const cabGeo = new THREE.BoxGeometry(1.6, 0.58, 2.2);
            const cabMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });

            for (let i = 0; i < 18; i++) {
                const oncoming = (i % 2 === 0);
                const lane = oncoming ? (i % 4 === 0 ? -2.0 : -5.6) : 1.95;
                const car = new THREE.Group();
                const body = new THREE.Mesh(bodyGeo, new THREE.MeshLambertMaterial({ color: colors[i % colors.length] }));
                body.position.y = 0.56;
                const cab = new THREE.Mesh(cabGeo, cabMat);
                cab.position.y = 1.18;
                car.add(body, cab);
                scene.add(car);

                trafficCars.push({
                    mesh: car,
                    z: -160 - i * 142,
                    lane,
                    speed: oncoming ? -12.5 - (i % 4) : 10.5 + (i % 3),
                    oncoming
                });
            }
        }

        // =========================================================================
        // 7. МУЛЬТИТАЧ-УПРАВЛЕНИЕ: РУЛЬ, ПЕДАЛИ, АКПП, СВОБОДНАЯ КАМЕРА И КЛАВИАТУРА
        // =========================================================================
        function recenterCamera() {
            if (state.cameraMode === 0) {
                state.camera.extTargetYaw = 0;
                state.camera.extTargetPitch = 0.24;
                state.camera.extTargetDist = 12.2;
            } else {
                state.camera.cabTargetYaw = 0;
                state.camera.cabTargetPitch = -0.04;
            }
        }

        function setupControls() {
            // --- 1. Свободное вращение камеры + зум двумя пальцами + двойной тап (строго по pointerId на canvas) ---
            const canvas = document.getElementById('game-canvas');
            const activeCanvasPointers = new Map();
            let lastPinchDist = null;
            let lastTapTime = 0;
            let tapCandidate = null;

            canvas.addEventListener('pointerdown', (e) => {
                if (!state.started) return;
                e.preventDefault();
                canvas.setPointerCapture(e.pointerId);
                activeCanvasPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activeCanvasPointers.size === 1) {
                    tapCandidate = { id: e.pointerId, startX: e.clientX, startY: e.clientY, time: performance.now(), moved: false };
                    lastPinchDist = null;
                } else if (activeCanvasPointers.size === 2) {
                    tapCandidate = null;
                    const pts = Array.from(activeCanvasPointers.values());
                    lastPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                }
            }, { passive: false });

            canvas.addEventListener('pointermove', (e) => {
                if (!activeCanvasPointers.has(e.pointerId)) return;
                e.preventDefault();
                const prev = activeCanvasPointers.get(e.pointerId);
                const dx = e.clientX - prev.x;
                const dy = e.clientY - prev.y;
                activeCanvasPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (tapCandidate && tapCandidate.id === e.pointerId) {
                    if (Math.hypot(e.clientX - tapCandidate.startX, e.clientY - tapCandidate.startY) > 12) {
                        tapCandidate.moved = true;
                    }
                }

                if (activeCanvasPointers.size === 1) {
                    const sensYaw = state.cameraMode === 0 ? 0.0062 : 0.0046;
                    const sensPitch = state.cameraMode === 0 ? 0.0046 : 0.0038;

                    if (state.cameraMode === 0) {
                        // Полный круговой 360° обзор вокруг автобуса
                        state.camera.extTargetYaw -= dx * sensYaw;
                        state.camera.extTargetPitch = Math.max(0.06, Math.min(1.18, state.camera.extTargetPitch + dy * sensPitch));
                    } else {
                        // Обзор головой в кабине: влево/вправо до зеркал и салона, вверх/вниз
                        state.camera.cabTargetYaw = Math.max(-2.65, Math.min(2.65, state.camera.cabTargetYaw - dx * sensYaw));
                        state.camera.cabTargetPitch = Math.max(-0.55, Math.min(0.62, state.camera.cabTargetPitch - dy * sensPitch));
                    }
                } else if (activeCanvasPointers.size === 2 && state.cameraMode === 0) {
                    const pts = Array.from(activeCanvasPointers.values());
                    const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                    if (lastPinchDist !== null) {
                        const delta = dist - lastPinchDist;
                        state.camera.extTargetDist = Math.max(6.8, Math.min(24.0, state.camera.extTargetDist - delta * 0.032));
                    }
                    lastPinchDist = dist;
                }
            }, { passive: false });

            function releaseCanvasPointer(e) {
                if (!activeCanvasPointers.has(e.pointerId)) return;
                activeCanvasPointers.delete(e.pointerId);

                if (tapCandidate && tapCandidate.id === e.pointerId) {
                    const now = performance.now();
                    if (!tapCandidate.moved && (now - tapCandidate.time) < 260) {
                        if (now - lastTapTime < 340) {
                            recenterCamera();
                            lastTapTime = 0;
                        } else {
                            lastTapTime = now;
                        }
                    }
                    tapCandidate = null;
                }

                if (activeCanvasPointers.size < 2) {
                    lastPinchDist = null;
                }
            }
            canvas.addEventListener('pointerup', releaseCanvasPointer);
            canvas.addEventListener('pointercancel', releaseCanvasPointer);

            // Колёсико мыши на ПК — приближение/отдаление во внешнем виде
            canvas.addEventListener('wheel', (e) => {
                if (!state.started || state.cameraMode !== 0) return;
                e.preventDefault();
                state.camera.extTargetDist = Math.max(6.8, Math.min(24.0, state.camera.extTargetDist + e.deltaY * 0.01));
            }, { passive: false });

            // --- 2. Интерактивный руль (multi-touch по pointerId) ---
            const steerZone = document.getElementById('steering-zone');
            let steerPointerId = null;
            let lastAngle = 0;
            let lastClientX = 0;
            let centerX = 0;
            let centerY = 0;

            function normalizeAngleDelta(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }

            steerZone.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (steerPointerId !== null) return;
                busAudio.start();
                steerPointerId = e.pointerId;
                steerZone.setPointerCapture(e.pointerId);

                const rect = steerZone.getBoundingClientRect();
                centerX = rect.left + rect.width * 0.5;
                centerY = rect.top + rect.height * 0.5;
                lastAngle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
                lastClientX = e.clientX;
                state.input.steeringTouchActive = true;
            }, { passive: false });

            steerZone.addEventListener('pointermove', (e) => {
                if (e.pointerId !== steerPointerId) return;
                e.preventDefault();
                e.stopPropagation();

                const dx = e.clientX - centerX;
                const dy = e.clientY - centerY;
                const dist = Math.hypot(dx, dy);

                let degDelta = 0;
                if (dist > 20) {
                    const currAngle = Math.atan2(dy, dx);
                    const deltaRad = normalizeAngleDelta(currAngle - lastAngle);
                    lastAngle = currAngle;
                    degDelta = (deltaRad * 180 / Math.PI) * 1.35;
                } else {
                    degDelta = (e.clientX - lastClientX) * 2.6;
                }
                lastClientX = e.clientX;

                state.bus.wheelVisualDeg = Math.max(-450, Math.min(450, state.bus.wheelVisualDeg + degDelta));
                state.input.steerTouchValue = -state.bus.wheelVisualDeg / 450;
            }, { passive: false });

            function releaseSteer(e) {
                if (e.pointerId !== steerPointerId) return;
                steerPointerId = null;
                state.input.steeringTouchActive = false;
            }
            steerZone.addEventListener('pointerup', releaseSteer);
            steerZone.addEventListener('pointercancel', releaseSteer);

            // --- 3. Педали Газа и Тормоза (независимые pointerId) ---
            function bindPedal(el, keyName) {
                let activePid = null;
                el.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    busAudio.start();
                    activePid = e.pointerId;
                    el.setPointerCapture(e.pointerId);
                    state.input[keyName] = true;
                    el.classList.add('pressed');
                }, { passive: false });

                const release = (e) => {
                    if (e.pointerId !== activePid) return;
                    activePid = null;
                    state.input[keyName] = false;
                    el.classList.remove('pressed');
                };
                el.addEventListener('pointerup', release);
                el.addEventListener('pointercancel', release);
            }
            bindPedal(document.getElementById('pedal-gas'), 'gasTouch');
            bindPedal(document.getElementById('pedal-brake'), 'brakeTouch');

            // --- 4. Селектор АКПП (D / N / R) ---
            ['D', 'N', 'R'].forEach(g => {
                const btn = document.getElementById(`gear-${g}`);
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    busAudio.start();
                    setGear(g);
                }, { passive: false });
            });

            // --- 5. Кнопки Дверей, Камеры, Звука, Повтора объявления, Старта и Рестарта ---
            document.getElementById('door-action-btn').addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleDoors();
            }, { passive: false });

            document.getElementById('btn-camera').addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                state.cameraMode = (state.cameraMode + 1) % 2;
            }, { passive: false });

            document.getElementById('btn-sound').addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                state.muted = !state.muted;
                busAudio.setMuted(state.muted);
                informator.setMuted(state.muted);
                document.getElementById('btn-sound').textContent = state.muted ? '🔇' : '🔊';
            }, { passive: false });

            document.getElementById('stop-pill').addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!state.started) return;
                const inZone = getActiveStopInZone();
                const nextStop = getNextRouteStop();
                informator.replayCurrent(nextStop, inZone ? inZone.stop : null);
            }, { passive: false });

            document.getElementById('btn-start').addEventListener('click', startGame);
            document.getElementById('btn-restart').addEventListener('click', restartGame);

            // --- 6. Поддержка клавиатуры для ПК ---
            window.addEventListener('keydown', (e) => {
                if (!state.started && (e.code === 'Space' || e.code === 'Enter')) {
                    startGame();
                    return;
                }
                if (e.code === 'KeyW' || e.code === 'ArrowUp') {
                    state.input.gasKey = true;
                    document.getElementById('pedal-gas').classList.add('pressed');
                }
                if (e.code === 'KeyS' || e.code === 'ArrowDown') {
                    state.input.brakeKey = true;
                    document.getElementById('pedal-brake').classList.add('pressed');
                }
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') state.input.leftKey = true;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') state.input.rightKey = true;
                if (e.code === 'Digit1') setGear('D');
                if (e.code === 'Digit2') setGear('N');
                if (e.code === 'Digit3') setGear('R');
                if (e.code === 'KeyE' || e.code === 'KeyO' || e.code === 'Space') toggleDoors();
                if (e.code === 'KeyC') state.cameraMode = (state.cameraMode + 1) % 2;
                if (e.code === 'KeyR') recenterCamera();
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') {
                    state.input.gasKey = false;
                    if (!state.input.gasTouch) document.getElementById('pedal-gas').classList.remove('pressed');
                }
                if (e.code === 'KeyS' || e.code === 'ArrowDown') {
                    state.input.brakeKey = false;
                    if (!state.input.brakeTouch) document.getElementById('pedal-brake').classList.remove('pressed');
                }
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') state.input.leftKey = false;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') state.input.rightKey = false;
            });
        }

        function setGear(target) {
            const speedKmh = Math.abs(state.bus.speed) * 3.6;
            // Защита АКПП от включения R на ходу вперёд и наоборот
            if ((target === 'R' && state.bus.speed > 1.8) || (target === 'D' && state.bus.speed < -1.8)) {
                return;
            }
            if (speedKmh > 6.5 && ((state.gear === 'D' && target === 'R') || (state.gear === 'R' && target === 'D'))) {
                return;
            }
            state.gear = target;
            ['D', 'N', 'R'].forEach(g => {
                const el = document.getElementById(`gear-${g}`);
                el.className = 'gear-btn' + (g === target ? ` active-${g}` : '');
            });
        }

        function startGame() {
            busAudio.start();
            informator.unlock();
            state.started = true;

            const ov = document.getElementById('start-overlay');
            ov.style.opacity = '0';
            setTimeout(() => { ov.style.display = 'none'; }, 480);

            ['top-bar', 'top-right-btns', 'speed-hud', 'steering-zone', 'right-controls'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('opacity-0', 'pointer-events-none');
            });

            // Приветственное объявление автоинформатора маршрута №32
            setTimeout(() => {
                informator.announceStart();
            }, 350);
        }

        function restartGame() {
            state.finished = false;
            state.gear = 'D';
            state.autoGearIdx = 0;
            setGear('D');

            const p0 = roadPoint(START_Z, HALF_ROAD - 2.2);
            state.bus.x = p0.x;
            state.bus.z = p0.z;
            state.bus.angle = p0.angle;
            state.bus.speed = 0;
            state.bus.accelSmooth = 0;
            state.bus.latAccelSmooth = 0;
            state.bus.brakePressure = 0;
            state.bus.steerTarget = 0;
            state.bus.steerActuator = 0;
            state.bus.wheelVisualDeg = 0;
            state.bus.pitch = 0;
            state.bus.roll = 0;
            state.bus.doorsOpen = false;
            state.bus.doorAnim = 0;

            state.currentStopIdx = 0;
            state.servedStops.clear();
            state.passengersInside = 0;
            state.totalPassengers = 0;
            state.lastOpenedStopId = -1;
            informator.reminderPlayed = false;
            recenterCamera();

            stopEntries.forEach(entry => {
                entry.zoneMesh.material.opacity = 1;
                entry.passengers.forEach(pax => {
                    pax.boarding = false;
                    pax.boarded = false;
                    pax.mesh.visible = true;
                    pax.mesh.position.set(pax.homeX, 0.18, pax.homeZ);
                });
            });

            const fin = document.getElementById('finish-overlay');
            fin.classList.add('hidden');
            fin.classList.remove('flex');

            setTimeout(() => informator.announceStart(), 350);
        }

        function getActiveStopInZone() {
            const busZ = state.bus.z;
            const lateral = state.bus.x - roadCenterX(busZ);
            if (lateral < 1.8) return null;
            for (let i = 0; i < stopEntries.length; i++) {
                if (Math.abs(busZ - stopEntries[i].stop.z) < 13.0) {
                    return stopEntries[i];
                }
            }
            return null;
        }

        function getNextRouteStop() {
            for (let i = 0; i < ROUTE_STOPS.length; i++) {
                if (!state.servedStops.has(i) && ROUTE_STOPS[i].z < state.bus.z + 14) {
                    return ROUTE_STOPS[i];
                }
            }
            return ROUTE_STOPS[ROUTE_STOPS.length - 1];
        }

        function toggleDoors() {
            if (!state.started || Math.abs(state.bus.speed) > 0.6) return;
            const entry = getActiveStopInZone();
            if (!state.bus.doorsOpen && !entry) return;

            state.bus.doorsOpen = !state.bus.doorsOpen;
            busAudio.playDoorSound(state.bus.doorsOpen);

            const label = document.getElementById('door-btn-text');
            label.textContent = state.bus.doorsOpen ? 'Закрыть двери' : 'Открыть двери';

            if (state.bus.doorsOpen && entry) {
                state.lastOpenedStopId = entry.stop.id;
                informator.announceArrival(entry.stop);

                if (!state.servedStops.has(entry.stop.id)) {
                    state.servedStops.add(entry.stop.id);
                    entry.zoneMesh.material.opacity = 0.25;

                    if (entry.stop.id === ROUTE_STOPS.length - 1) {
                        state.passengersInside = 0;
                        setTimeout(showFinishScreen, 3600);
                    } else if (state.passengersInside > 0) {
                        state.passengersInside = Math.max(0, state.passengersInside - (1 + (entry.stop.id % 4)));
                    }

                    entry.passengers.forEach((pax, idx) => {
                        setTimeout(() => { pax.boarding = true; }, idx * 200);
                    });

                    if (entry.stop.id + 1 < ROUTE_STOPS.length) {
                        state.currentStopIdx = entry.stop.id + 1;
                    }
                }
            } else if (!state.bus.doorsOpen) {
                // Закрытие дверей — объявляем следующую остановку
                const nextId = state.lastOpenedStopId + 1;
                if (nextId > 0 && nextId < ROUTE_STOPS.length) {
                    informator.announceDeparture(ROUTE_STOPS[nextId]);

                    // В середине маршрута (после Драмтеатра) — напоминание пассажирам
                    if (state.lastOpenedStopId === 4 && !informator.reminderPlayed) {
                        setTimeout(() => {
                            if (state.started && !state.finished && !state.bus.doorsOpen) {
                                informator.announceReminder();
                            }
                        }, 8500);
                    }
                }
            }
        }

        function showFinishScreen() {
            if (state.finished) return;
            state.finished = true;
            document.getElementById('final-stops').textContent = `${state.servedStops.size} / ${ROUTE_STOPS.length}`;
            document.getElementById('final-pax').textContent = `${state.totalPassengers}`;
            const fin = document.getElementById('finish-overlay');
            fin.classList.remove('hidden');
            fin.classList.add('flex');
        }

        // =========================================================================
        // 8. ТЯЖЁЛАЯ ФИЗИКА АВТОБУСА, ПОДВЕСКА, КАМЕРА И ОБНОВЛЕНИЕ HUD
        // =========================================================================
        const wheelVisualEl = document.getElementById('steering-wheel-visual');
        const speedDigitsEl = document.getElementById('speed-digits');
        const hudGearBadgeEl = document.getElementById('hud-gear-badge');
        const stopInfoEl = document.getElementById('stop-info-text');
        const doorBtnEl = document.getElementById('door-action-btn');

        const tmpCamVec = new THREE.Vector3();
        const tmpLookVec = new THREE.Vector3();

        function updateSimulation(dt) {
            const bus = state.bus;
            const gas = state.input.gasTouch || state.input.gasKey;
            const brake = state.input.brakeTouch || state.input.brakeKey;
            const prevSpeed = bus.speed;

            // --- 1. Плавное гидравлическое рулевое управление ---
            if (state.input.steeringTouchActive) {
                bus.steerTarget = state.input.steerTouchValue;
            } else if (state.input.leftKey || state.input.rightKey) {
                const dir = (state.input.leftKey ? 1 : 0) - (state.input.rightKey ? 1 : 0);
                // Плавное вращение баранки с клавиатуры (без рывков)
                bus.steerTarget = Math.max(-1, Math.min(1, bus.steerTarget + dir * 1.45 * dt));
                bus.wheelVisualDeg = -bus.steerTarget * 450;
            } else {
                // Плавный самовозврат руля в ноль (усиливается с ростом скорости)
                const returnRate = 1.65 + Math.min(Math.abs(bus.speed) * 0.28, 3.2);
                const decay = Math.exp(-returnRate * dt);
                bus.steerTarget *= decay;
                if (Math.abs(bus.steerTarget) < 0.004) bus.steerTarget = 0;
                bus.wheelVisualDeg = -bus.steerTarget * 450;
            }

            // Гидравлический демпфер рулевого механизма — убирает резкие дёрганья
            bus.steerActuator += (bus.steerTarget - bus.steerActuator) * (1 - Math.exp(-5.8 * dt));

            wheelVisualEl.style.transform = `rotate(${bus.wheelVisualDeg.toFixed(1)}deg)`;
            if (cabinWheelMesh) {
                cabinWheelMesh.rotation.z = -bus.wheelVisualDeg * Math.PI / 180;
            }
            frontWheelPivots.forEach(p => { p.rotation.y = bus.steerActuator * 0.48; });

            // --- 2. Прогрессивные пневматические тормоза ---
            if (brake || bus.doorsOpen) {
                const rampRate = bus.doorsOpen ? 3.5 : 2.35;
                bus.brakePressure = Math.min(1, bus.brakePressure + rampRate * dt);
                bus.peakBrakeHeld = Math.max(bus.peakBrakeHeld, bus.brakePressure);
                if (Math.abs(bus.speed) > 0.5) bus.wasStoppingBrake = true;
            } else {
                // Пшик пневматики при отпускании хорошо нажатой педали тормоза
                if (bus.peakBrakeHeld > 0.42 && bus.brakePressure > 0.25) {
                    busAudio.playAirHiss(0.32, 1480, 0.09);
                    bus.peakBrakeHeld = 0;
                }
                bus.brakePressure = Math.max(0, bus.brakePressure - 3.4 * dt);
                if (bus.brakePressure < 0.05) bus.wasStoppingBrake = false;
            }

            // --- 3. Продольная динамика тяжёлого автобуса и 5-ступенчатая АКПП ---
            const speedKmh = Math.abs(bus.speed) * 3.6;
            let rpmNorm = 0.05;

            if (!state.started) {
                bus.speed = 0;
            } else {
                // Низкое сопротивление качению + мягкое аэродинамическое сопротивление (высокая инерция!)
                const rollingDrag = 0.088;
                const aeroDrag = 0.00046 * bus.speed * bus.speed;
                const passiveDrag = rollingDrag + aeroDrag;

                let netAccel = 0;

                if (bus.doorsOpen) {
                    // Остановочный тормоз блокирует движение при открытых дверях
                    const holdDecel = 5.0;
                    if (Math.abs(bus.speed) <= holdDecel * dt) bus.speed = 0;
                    else bus.speed -= Math.sign(bus.speed) * holdDecel * dt;
                    rpmNorm = 0.04;
                } else {
                    // Работа 5-ступенчатой автоматической коробки в режиме D
                    if (state.gear === 'D') {
                        const cur = AUTO_GEARS[state.autoGearIdx];
                        if (speedKmh > cur.maxKmh && state.autoGearIdx < AUTO_GEARS.length - 1) {
                            state.autoGearIdx++;
                            state.shiftPauseTimer = 0.16; // Мягкий момент переключения передачи
                        } else if (speedKmh < cur.minKmh && state.autoGearIdx > 0) {
                            state.autoGearIdx--;
                        }

                        if (state.shiftPauseTimer > 0) {
                            state.shiftPauseTimer = Math.max(0, state.shiftPauseTimer - dt);
                        }

                        const activeGear = AUTO_GEARS[state.autoGearIdx];
                        const maxFwdMs = 58 / 3.6; // ~16.11 м/с (городской лимит 58 км/ч)

                        // Расчёт оборотов двигателя для звука дизеля
                        const gearSpan = Math.max(8, activeGear.maxKmh - activeGear.minKmh);
                        const gearProgress = Math.max(0, Math.min(1, (speedKmh - activeGear.minKmh) / gearSpan));
                        rpmNorm = 0.14 + gearProgress * 0.68 + (gas ? 0.15 : 0) - (state.shiftPauseTimer > 0 ? 0.18 : 0);

                        if (bus.brakePressure > 0.02) {
                            // Прогрессивное пневматическое торможение (не включает задний ход)
                            const brakeDecel = bus.brakePressure * 4.45 + passiveDrag;
                            if (Math.abs(bus.speed) <= brakeDecel * dt) {
                                if (bus.wasStoppingBrake && Math.abs(bus.speed) > 0.05) {
                                    busAudio.playAirHiss(0.28, 1280, 0.085);
                                    bus.wasStoppingBrake = false;
                                }
                                bus.speed = 0;
                            } else {
                                bus.speed -= Math.sign(bus.speed) * brakeDecel * dt;
                            }
                        } else if (gas) {
                            // Плавный прогрессивный разгон (0–50 км/ч за ~16–18 секунд)
                            const shiftFactor = state.shiftPauseTimer > 0 ? 0.35 : 1.0;
                            const speedCapFactor = Math.max(0, 1 - Math.pow(Math.max(0, bus.speed) / (maxFwdMs * 1.03), 3));
                            netAccel = activeGear.accel * shiftFactor * speedCapFactor - passiveDrag;
                            bus.speed = Math.min(maxFwdMs, bus.speed + netAccel * dt);
                        } else {
                            // Высокая инерция: долгий плавный выбег + лёгкий ползучий ход АКПП до ~4.8 км/ч
                            if (bus.speed < 1.32) {
                                bus.speed = Math.min(1.32, bus.speed + 0.38 * dt);
                            } else {
                                bus.speed = Math.max(0, bus.speed - passiveDrag * dt);
                            }
                        }
                    } else if (state.gear === 'R') {
                        const maxRevMs = -15 / 3.6; // ~4.17 м/с (~15 км/ч)
                        rpmNorm = 0.14 + Math.min(1, speedKmh / 15) * 0.55 + (gas ? 0.16 : 0);

                        if (bus.brakePressure > 0.02) {
                            const brakeDecel = bus.brakePressure * 4.45 + passiveDrag;
                            if (Math.abs(bus.speed) <= brakeDecel * dt) {
                                if (bus.wasStoppingBrake && Math.abs(bus.speed) > 0.05) {
                                    busAudio.playAirHiss(0.26, 1280, 0.08);
                                    bus.wasStoppingBrake = false;
                                }
                                bus.speed = 0;
                            } else {
                                bus.speed -= Math.sign(bus.speed) * brakeDecel * dt;
                            }
                        } else if (gas) {
                            const revCap = Math.max(0, 1 - Math.abs(bus.speed) / Math.abs(maxRevMs));
                            bus.speed = Math.max(maxRevMs, bus.speed - (0.95 * revCap + 0.18) * dt);
                        } else {
                            // Лёгкий ползучий ход назад до ~3.2 км/ч или плавный выбег
                            if (bus.speed > -0.9) {
                                bus.speed = Math.max(-0.9, bus.speed - 0.32 * dt);
                            } else {
                                bus.speed = Math.min(0, bus.speed + passiveDrag * dt);
                            }
                        }
                    } else {
                        // Режим N (нейтраль): свободный инерционный накат
                        rpmNorm = gas ? 0.45 : 0.06;
                        const decel = (bus.brakePressure * 4.45) + passiveDrag;
                        if (Math.abs(bus.speed) <= decel * dt) {
                            bus.speed = 0;
                        } else {
                            bus.speed -= Math.sign(bus.speed) * decel * dt;
                        }
                    }
                }
            }

            // --- 4. Поворот с чувствительностью к скорости и физика подвески (клевок + крен) ---
            let yawRate = 0;
            if (Math.abs(bus.speed) > 0.04) {
                const dir = bus.speed >= 0 ? 1 : -1;
                // При высокой скорости угол поворота становится мягче для устойчивости
                const speedSensitivity = 1.0 / (1 + Math.abs(bus.speed) * 0.048);
                const lowSpeedScale = Math.min(Math.abs(bus.speed) / 5.2, 1.0);
                yawRate = bus.steerActuator * dir * lowSpeedScale * speedSensitivity * 0.92;
                bus.angle += yawRate * dt;
            }

            bus.x -= Math.sin(bus.angle) * bus.speed * dt;
            bus.z -= Math.cos(bus.angle) * bus.speed * dt;

            // Мягкое удержание на проезжей части вдоль бордюров
            if (bus.z > 20) { bus.z = 20; bus.speed = 0; }
            if (bus.z < END_Z) { bus.z = END_Z; bus.speed = 0; }

            const cx = roadCenterX(bus.z);
            const rAng = roadAngle(bus.z);
            const lateral = bus.x - cx;
            const maxLat = HALF_ROAD - 1.38;
            if (lateral > maxLat) {
                bus.x = cx + maxLat;
                bus.angle += (rAng - bus.angle) * 0.16;
                bus.speed *= 0.92;
            } else if (lateral < -maxLat) {
                bus.x = cx - maxLat;
                bus.angle += (rAng - bus.angle) * 0.16;
                bus.speed *= 0.92;
            }

            // Подвеска кузова (клевок носом при торможении, приседание на разгоне, крен в поворотах)
            const instAccel = (bus.speed - prevSpeed) / Math.max(dt, 0.001);
            const clampedAccel = Math.max(-5.5, Math.min(3.0, instAccel));
            bus.accelSmooth += (clampedAccel - bus.accelSmooth) * (1 - Math.exp(-5.5 * dt));

            const instLatAccel = bus.speed * yawRate;
            bus.latAccelSmooth += (instLatAccel - bus.latAccelSmooth) * (1 - Math.exp(-4.8 * dt));

            // Положительный rotation.x задирает нос (-Z вверх), отрицательный — клюёт носом вниз
            const targetPitch = Math.max(-0.028, Math.min(0.018, bus.accelSmooth * 0.0062));
            // Крен наружу поворота
            const targetRoll = Math.max(-0.036, Math.min(0.036, -bus.latAccelSmooth * 0.0075));

            bus.pitch += (targetPitch - bus.pitch) * (1 - Math.exp(-6.2 * dt));
            bus.roll += (targetRoll - bus.roll) * (1 - Math.exp(-5.5 * dt));

            // Лёгкая дорожная микровибрация пневмоподвески в движении
            const roadMicroBounce = Math.abs(bus.speed) > 0.3
                ? Math.sin(clock.elapsedTime * (5 + Math.abs(bus.speed) * 0.5)) * 0.009 * Math.min(1, Math.abs(bus.speed) / 8)
                : 0;

            busGroup.position.set(bus.x, 0, bus.z);
            busGroup.rotation.y = bus.angle;
            busChassis.rotation.x = bus.pitch;
            busChassis.rotation.z = bus.roll;
            busChassis.position.y = roadMicroBounce;

            allWheelRollMeshes.forEach(w => { w.rotation.x -= bus.speed * dt * 1.85; });

            // Анимация сдвижных дверей
            const targetDoor = bus.doorsOpen ? 1 : 0;
            bus.doorAnim += (targetDoor - bus.doorAnim) * Math.min(1, 5.5 * dt);
            doorMeshes.forEach(d => {
                d.position.x = d.userData.baseX + bus.doorAnim * 0.14;
                d.position.z = d.userData.baseZ + bus.doorAnim * 1.12;
            });

            // Стоп-сигналы и фонари заднего хода
            const brakingNow = bus.brakePressure > 0.08 || bus.doorsOpen;
            brakeLightMats.forEach(m => m.color.setHex(brakingNow ? 0xff2222 : 0x7f1d1d));
            reverseLightMats.forEach(m => m.color.setHex(state.gear === 'R' ? 0xffffff : 0x475569));

            // --- 5. Посадка пассажиров на остановках ---
            const doorWorld = new THREE.Vector3(1.4, 0, -2.2).applyAxisAngle(new THREE.Vector3(0, 1, 0), bus.angle);
            const targetDoorX = bus.x + doorWorld.x;
            const targetDoorZ = bus.z + doorWorld.z;

            stopEntries.forEach(entry => {
                entry.passengers.forEach(pax => {
                    if (pax.boarding && !pax.boarded) {
                        const dx = targetDoorX - pax.mesh.position.x;
                        const dz = targetDoorZ - pax.mesh.position.z;
                        const dist = Math.hypot(dx, dz);
                        if (dist < 0.78) {
                            pax.boarded = true;
                            pax.boarding = false;
                            pax.mesh.visible = false;
                            state.passengersInside++;
                            state.totalPassengers++;
                            busAudio.playBoardChime();
                        } else {
                            const stepMove = Math.min(dist, 2.5 * dt);
                            pax.mesh.position.x += (dx / dist) * stepMove;
                            pax.mesh.position.z += (dz / dist) * stepMove;
                            pax.mesh.position.y = 0.18 + Math.abs(Math.sin(clock.elapsedTime * 10)) * 0.085;
                        }
                    }
                });
            });

            // --- 6. Движение трафика и облаков ---
            trafficCars.forEach(car => {
                car.z -= car.speed * dt;
                if (car.oncoming && car.z > 40) car.z = -2740;
                if (!car.oncoming && car.z < -2740) car.z = 35;

                const p = roadPoint(car.z, car.lane);
                car.mesh.position.set(p.x, 0, p.z);
                car.mesh.rotation.y = p.angle + (car.oncoming ? Math.PI : 0);
            });

            cloudMeshes.forEach((c, idx) => {
                c.position.x += (0.45 + (idx % 3) * 0.22) * dt;
            });
            const skyDome = scene.getObjectByName('skyDome');
            if (skyDome) skyDome.position.set(bus.x, 0, bus.z);

            sunLight.position.set(bus.x + 42, 72, bus.z + 32);
            sunLight.target.position.set(bus.x, 0, bus.z - 12);

            // --- 7. Обновление свободной камеры ---
            updateCamera(dt);

            // --- 8. Звук двигателя и минималистичный HUD ---
            busAudio.updateEngine(rpmNorm, gas, state.gear);
            speedDigitsEl.textContent = Math.round(speedKmh);

            if (state.gear === 'D') {
                hudGearBadgeEl.textContent = `D${state.autoGearIdx + 1}`;
                hudGearBadgeEl.className = 'font-mono font-extrabold text-xs px-1.5 py-0.5 rounded-md bg-emerald-500/25 text-emerald-300 border border-emerald-400/40 self-center';
            } else if (state.gear === 'R') {
                hudGearBadgeEl.textContent = 'R';
                hudGearBadgeEl.className = 'font-mono font-extrabold text-xs px-1.5 py-0.5 rounded-md bg-rose-500/25 text-rose-300 border border-rose-400/40 self-center';
            } else {
                hudGearBadgeEl.textContent = 'N';
                hudGearBadgeEl.className = 'font-mono font-extrabold text-xs px-1.5 py-0.5 rounded-md bg-amber-500/25 text-amber-300 border border-amber-400/40 self-center';
            }

            const nextStop = getNextRouteStop();
            const distM = Math.max(0, Math.round(bus.z - nextStop.z));
            stopInfoEl.textContent = distM <= 12 ? `${nextStop.name} · на месте` : `${nextStop.name} · ${distM} м`;

            const inZone = getActiveStopInZone();
            const showDoorBtn = state.started && (bus.doorsOpen || (inZone && Math.abs(bus.speed) < 0.6 && !state.servedStops.has(inZone.stop.id)));
            if (showDoorBtn) {
                doorBtnEl.classList.remove('hidden-btn');
                document.getElementById('door-btn-text').textContent = bus.doorsOpen ? 'Закрыть двери' : 'Открыть двери';
            } else {
                doorBtnEl.classList.add('hidden-btn');
            }
        }

        function updateCamera(dt) {
            const bus = state.bus;
            const cam = state.camera;

            if (!state.started) {
                const t = clock.elapsedTime * 0.25;
                camera.position.set(bus.x + Math.sin(t) * 13.5, 4.9, bus.z + Math.cos(t) * 13.5);
                camera.lookAt(bus.x, 2.0, bus.z - 1.5);
                return;
            }

            const damp = 1 - Math.exp(-10.5 * dt);

            if (state.cameraMode === 0) {
                // Плавное демпфирование свободной 360° орбиты без принудительного возврата
                cam.extYaw += (cam.extTargetYaw - cam.extYaw) * damp;
                cam.extPitch += (cam.extTargetPitch - cam.extPitch) * damp;
                cam.extDist += (cam.extTargetDist - cam.extDist) * damp;

                const worldYaw = bus.angle + cam.extYaw;
                const horiz = Math.cos(cam.extPitch) * cam.extDist;
                const vert = Math.sin(cam.extPitch) * cam.extDist;

                const targetX = bus.x + Math.sin(worldYaw) * horiz;
                const targetY = Math.max(0.85, 2.1 + vert);
                const targetZ = bus.z + Math.cos(worldYaw) * horiz;

                camera.position.set(targetX, targetY, targetZ);
                camera.lookAt(bus.x, 2.1, bus.z);
            } else {
                // Вид из кабины водителя: плавный обзор зеркал, окон и пассажирского салона + работа подвески
                cam.cabYaw += (cam.cabTargetYaw - cam.cabYaw) * damp;
                cam.cabPitch += (cam.cabTargetPitch - cam.cabPitch) * damp;

                busGroup.updateMatrixWorld(true);
                tmpCamVec.set(-0.68, 2.34, -4.28);
                busChassis.localToWorld(tmpCamVec);
                camera.position.copy(tmpCamVec);

                // Направление взгляда относительно кабины
                const lookDist = 18;
                const lx = -Math.sin(cam.cabYaw) * Math.cos(cam.cabPitch) * lookDist;
                const ly = Math.sin(cam.cabPitch) * lookDist;
                const lz = -Math.cos(cam.cabYaw) * Math.cos(cam.cabPitch) * lookDist;

                tmpLookVec.set(-0.68 + lx, 2.34 + ly, -4.28 + lz);
                busChassis.localToWorld(tmpLookVec);
                camera.lookAt(tmpLookVec);
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.08);
            updateSimulation(dt);
            renderer.render(scene, camera);
        }

        window.onload = function () {
            informator.initDOM();
            initScene();
            setupControls();
            animate();
        };
    })();
    </script>
</body>
</html>
