<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Автобус №32 · Калининград 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b1324;
            font-family: 'Inter', sans-serif;
            touch-action: none;
            overscroll-behavior: none;
        }
        #game-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: grab;
        }
        #game-canvas:active {
            cursor: grabbing;
        }

        /* Полупрозрачное матовое стекло для минималистичного HUD */
        .hud-glass {
            background: rgba(10, 17, 32, 0.56);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Янтарное светодиодное табло автоинформатора */
        .informator-led {
            background: rgba(12, 14, 20, 0.78);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(251, 191, 36, 0.42);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45), inset 0 0 12px rgba(245, 158, 11, 0.12);
            font-family: 'JetBrains Mono', monospace;
            color: #fbbf24;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.45);
            transition: opacity 0.45s ease, transform 0.45s ease;
        }
        .informator-led.hidden-led {
            opacity: 0;
            transform: translateY(-6px) scale(0.97);
            pointer-events: none;
        }

        /* Контейнер руля (снизу слева) */
        #steering-zone {
            position: fixed;
            left: max(14px, calc(var(--safe-left) + 12px));
            bottom: max(14px, calc(var(--safe-bottom) + 12px));
            width: clamp(134px, 24vmin, 178px);
            height: clamp(134px, 24vmin, 178px);
            z-index: 30;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #steering-wheel-visual {
            width: 100%;
            height: 100%;
            will-change: transform;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.55));
            pointer-events: none;
        }

        /* Правый блок: АКПП + Педали */
        #right-controls {
            position: fixed;
            right: max(14px, calc(var(--safe-right) + 12px));
            bottom: max(14px, calc(var(--safe-bottom) + 12px));
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            touch-action: none;
        }

        /* Селектор АКПП D / N / R */
        .gear-selector {
            display: flex;
            gap: 4px;
            padding: 4px;
            border-radius: 16px;
            background: rgba(10, 16, 30, 0.66);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
        }
        .gear-btn {
            width: clamp(38px, 6.5vmin, 46px);
            height: clamp(34px, 5.5vmin, 40px);
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: clamp(14px, 2.5vmin, 17px);
            color: rgba(255, 255, 255, 0.48);
            background: transparent;
            border: 1px solid transparent;
            transition: all 0.18s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gear-btn.active-D {
            color: #ecfdf5;
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.88), rgba(5, 150, 105, 0.88));
            border-color: rgba(110, 231, 183, 0.75);
            box-shadow: 0 0 14px rgba(16, 185, 129, 0.55);
        }
        .gear-btn.active-N {
            color: #fefce8;
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.84), rgba(217, 119, 6, 0.84));
            border-color: rgba(252, 211, 77, 0.72);
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.5);
        }
        .gear-btn.active-R {
            color: #fef2f2;
            background: linear-gradient(180deg, rgba(239, 68, 68, 0.88), rgba(185, 28, 28, 0.88));
            border-color: rgba(252, 165, 165, 0.75);
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.55);
        }

        /* Педали тормоза и газа */
        .pedals-row {
            display: flex;
            align-items: flex-end;
            gap: clamp(10px, 2vmin, 16px);
        }
        .pedal {
            position: relative;
            border-radius: 16px;
            background: linear-gradient(165deg, rgba(226, 232, 240, 0.28) 0%, rgba(51, 65, 85, 0.52) 55%, rgba(15, 23, 42, 0.74) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.48), inset 0 2px 5px rgba(255, 255, 255, 0.22);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px 8px;
            transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.08s ease;
            touch-action: none;
            cursor: pointer;
            overflow: hidden;
        }
        .pedal-ribs {
            width: 78%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            padding: 4px 0;
            pointer-events: none;
        }
        .pedal-rib {
            height: 4px;
            border-radius: 99px;
            background: rgba(15, 23, 42, 0.65);
            border-bottom: 1px solid rgba(255, 255, 255, 0.22);
        }
        .pedal-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        #pedal-brake {
            width: clamp(72px, 14.2vmin, 94px);
            height: clamp(86px, 16vmin, 108px);
            border-color: rgba(251, 113, 133, 0.45);
        }
        #pedal-brake.pressed {
            transform: scale(0.93) translateY(5px) perspective(240px) rotateX(12deg);
            border-color: rgba(244, 63, 94, 0.95);
            box-shadow: 0 3px 10px rgba(244, 63, 94, 0.45), inset 0 2px 10px rgba(244, 63, 94, 0.35);
        }

        #pedal-gas {
            width: clamp(60px, 11.8vmin, 76px);
            height: clamp(116px, 21.5vmin, 148px);
            border-color: rgba(52, 211, 153, 0.45);
        }
        #pedal-gas.pressed {
            transform: scale(0.93) translateY(6px) perspective(240px) rotateX(14deg);
            border-color: rgba(16, 185, 129, 0.95);
            box-shadow: 0 3px 12px rgba(16, 185, 129, 0.45), inset 0 2px 10px rgba(16, 185, 129, 0.35);
        }

        /* Цифровой спидометр по центру снизу */
        #speed-hud {
            position: fixed;
            left: 50%;
            bottom: max(16px, calc(var(--safe-bottom) + 12px));
            transform: translateX(-50%);
            z-index: 25;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .speed-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: clamp(32px, 6.2vmin, 46px);
            line-height: 0.95;
            letter-spacing: -0.03em;
            color: #ffffff;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
        }

        /* Контекстная кнопка Дверей */
        #door-action-btn {
            pointer-events: auto;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        #door-action-btn.hidden-btn {
            opacity: 0;
            transform: translateY(12px) scale(0.9);
            pointer-events: none;
        }
        @keyframes soft-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.65); }
            50% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
        }
        .door-pulse {
            animation: soft-pulse 1.5s infinite;
        }

        /* На узких вертикальных телефонах поднимаем спидометр выше руля и педалей */
        @media (max-width: 460px) and (orientation: portrait) {
            #speed-hud {
                bottom: max(176px, calc(var(--safe-bottom) + 170px));
            }
        }
    </style>
</head>
<body>
    <!-- 3D Viewport Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Верхняя зона: компактная плашка остановки + выезжающее LED-табло информатора -->
    <div id="top-bar" class="fixed left-1/2 -translate-x-1/2 z-30 flex flex-col items-center gap-1.5 transition-opacity duration-300 opacity-0 pointer-events-none"
         style="top: max(10px, calc(var(--safe-top) + 8px)); width: min(92vw, 480px);">
        <!-- Нажмите на плашку остановки, чтобы повторить объявление информатора -->
        <button id="stop-pill" type="button" title="Нажмите для повтора объявления"
                class="hud-glass pointer-events-auto rounded-full px-3.5 py-1.5 flex items-center gap-2 shadow-lg active:scale-95 transition cursor-pointer max-w-[calc(100vw-116px)]">
            <span class="bg-emerald-500 text-slate-950 font-black text-xs px-2 py-0.5 rounded-full leading-none shrink-0">32</span>
            <span id="stop-info-text" class="text-white/95 font-semibold text-xs sm:text-sm truncate">
                Силикатный завод · на месте
            </span>
        </button>

        <!-- Светодиодное табло автоинформатора (появляется только во время объявления) -->
        <div id="informator-pill" class="informator-led hidden-led rounded-2xl px-3.5 py-1.5 flex items-center gap-2 max-w-[92vw] sm:max-w-[460px]">
            <span class="text-amber-400 text-xs shrink-0 animate-pulse">📢</span>
            <span id="informator-text" class="text-[11px] sm:text-xs font-bold leading-snug line-clamp-2">
                Остановка: Силикатный завод
            </span>
        </div>
    </div>

    <!-- Две миниатюрные круглые кнопки справа сверху: Камера и Звук/Информатор -->
    <div id="top-right-btns" class="fixed z-30 flex items-center gap-2 transition-opacity duration-300 opacity-0 pointer-events-none"
         style="top: max(10px, calc(var(--safe-top) + 8px)); right: max(12px, calc(var(--safe-right) + 10px));">
        <button id="btn-sound" type="button" aria-label="Звук и автоинформатор"
                class="hud-glass w-10 h-10 rounded-full flex items-center justify-center text-base text-white/90 active:scale-90 transition shadow-lg cursor-pointer">
            🔊
        </button>
        <button id="btn-camera" type="button" aria-label="Сменить вид камеры"
                class="hud-glass w-10 h-10 rounded-full flex items-center justify-center text-base text-white/90 active:scale-90 transition shadow-lg cursor-pointer">
            📷
        </button>
    </div>

    <!-- Спидометр (с индикатором передачи) + Контекстная кнопка Дверей -->
    <div id="speed-hud" class="transition-opacity duration-300 opacity-0">
        <button id="door-action-btn" type="button"
                class="hidden-btn door-pulse bg-emerald-500/90 hover:bg-emerald-400 active:scale-95 text-slate-950 font-extrabold text-xs sm:text-sm px-5 py-2.5 rounded-full shadow-xl border border-emerald-200/70 flex items-center gap-2 cursor-pointer">
            <span>🚪</span>
            <span id="door-btn-text">Открыть двери</span>
        </button>

        <div class="hud-glass rounded-2xl px-4 py-1.5 flex items-baseline gap-2 shadow-xl">
            <span id="hud-gear-badge" class="font-mono font-extrabold text-xs px-1.5 py-0.5 rounded-md bg-emerald-500/25 text-emerald-300 border border-emerald-400/40 self-center">D1</span>
            <span id="speed-digits" class="speed-value">0</span>
            <span class="text-[11px] font-bold uppercase tracking-wider text-white/60">км/ч</span>
        </div>
    </div>

    <!-- Интерактивный руль (снизу слева) -->
    <div id="steering-zone" class="transition-opacity duration-300 opacity-0 pointer-events-none">
        <svg id="steering-wheel-visual" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#334155"/>
                    <stop offset="45%" stop-color="#1e293b"/>
                    <stop offset="100%" stop-color="#0f172a"/>
                </linearGradient>
                <linearGradient id="spokeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#475569"/>
                    <stop offset="100%" stop-color="#1e293b"/>
                </linearGradient>
                <radialGradient id="hubGrad" cx="40%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#334155"/>
                    <stop offset="100%" stop-color="#0b1120"/>
                </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="92" fill="rgba(15,23,42,0.20)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
            <path d="M22 92 L78 96 L78 112 L22 108 Z" fill="url(#spokeGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
            <path d="M178 92 L122 96 L122 112 L178 108 Z" fill="url(#spokeGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
            <path d="M88 122 L82 178 L96 178 L100 130 L104 178 L118 178 L112 122 Z" fill="url(#spokeGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
            <circle cx="100" cy="100" r="80" fill="none" stroke="url(#rimGrad)" stroke-width="18"/>
            <circle cx="100" cy="100" r="88.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
            <circle cx="100" cy="100" r="71.5" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="1.5"/>
            <!-- Верхняя жёлтая метка центра -->
            <rect x="95" y="11" width="10" height="18" rx="3" fill="#f59e0b" stroke="#fef3c7" stroke-width="1"/>
            <path d="M21 76 A80 80 0 0 0 21 124" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="4" stroke-linecap="round"/>
            <path d="M179 76 A80 80 0 0 1 179 124" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="4" stroke-linecap="round"/>
            <circle cx="100" cy="103" r="28" fill="url(#hubGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
            <circle cx="100" cy="103" r="19" fill="none" stroke="rgba(16,185,129,0.55)" stroke-width="1.5"/>
            <text x="100" y="108" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-weight="900" font-size="14">32</text>
        </svg>
    </div>

    <!-- Правый блок: АКПП (D / N / R) + Педали (Тормоз и Газ) -->
    <div id="right-controls" class="transition-opacity duration-300 opacity-0 pointer-events-none">
        <div class="gear-selector" role="group" aria-label="Коробка передач">
            <button id="gear-D" type="button" class="gear-btn active-D" data-gear="D">D</button>
            <button id="gear-N" type="button" class="gear-btn" data-gear="N">N</button>
            <button id="gear-R" type="button" class="gear-btn" data-gear="R">R</button>
        </div>

        <div class="pedals-row">
            <div id="pedal-brake" class="pedal" aria-label="Тормоз">
                <div class="pedal-ribs">
                    <div class="pedal-rib"></div>
                    <div class="pedal-rib"></div>
                    <div class="pedal-rib"></div>
                    <div class="pedal-rib"></div>
                </div>
                <span class="pedal-label text-rose-200">Тормоз</span>
            </div>

            <div id="pedal-gas" class="pedal" aria-label="Газ">
                <div class="pedal-ribs">
                    <div class="pedal-rib"></div>
                    <div class="pedal-rib"></div>
                    <div class="pedal-rib"></div>
                    <div class="pedal-rib"></div>
                    <div class="pedal-rib"></div>
                </div>
                <span class="pedal-label text-emerald-200">Газ</span>
            </div>
        </div>
    </div>

    <!-- Чистый стартовый экран поверх живой 3D-сцены Калининграда -->
    <div id="start-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-5 bg-slate-950/35 backdrop-blur-[4px] transition-opacity duration-500">
        <div class="hud-glass rounded-3xl px-7 py-7 max-w-sm w-full text-center shadow-2xl border border-white/20">
            <div class="inline-flex items-center justify-center bg-emerald-500 text-slate-950 font-black text-2xl w-14 h-14 rounded-2xl shadow-lg mb-3">
                32
            </div>
            <h1 class="text-white text-2xl font-black tracking-tight">Маршрут №32 • Калининград</h1>
            <p class="text-emerald-200/90 text-sm font-medium mt-1">
                Силикатный завод — Улица Артиллерийская
            </p>
            <p class="text-slate-300/85 text-xs mt-3 leading-relaxed">
                Крутите экран, чтобы вращать камеру • Двойной тап — сброс
            </p>
            <button id="btn-start" type="button"
                    class="mt-5 w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-95 text-slate-950 font-black text-lg py-3.5 rounded-2xl shadow-xl transition cursor-pointer">
                Поехали
            </button>
        </div>
    </div>

    <!-- Окно завершения маршрута -->
    <div id="finish-overlay" class="fixed inset-0 z-50 hidden items-center justify-center p-5 bg-slate-950/60 backdrop-blur-md">
        <div class="hud-glass rounded-3xl px-7 py-7 max-w-sm w-full text-center shadow-2xl border border-emerald-400/50">
            <div class="text-4xl mb-2">🏁</div>
            <h2 class="text-white text-2xl font-black">Рейс №32 завершён</h2>
            <p class="text-slate-300 text-sm mt-1">Конечная: Улица Артиллерийская</p>
            <div class="mt-4 flex justify-center gap-6 text-sm text-white/90">
                <div>
                    <div class="text-xs text-slate-400">Остановки</div>
                    <div id="final-stops" class="text-xl font-black text-emerald-400">10 / 10</div>
                </div>
                <div class="w-px bg-white/15"></div>
                <div>
                    <div class="text-xs text-slate-400">Пассажиры</div>
                    <div id="final-pax" class="text-xl font-black text-amber-300">0</div>
                </div>
            </div>
            <button id="btn-restart" type="button"
                    class="mt-6 w-full bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-black text-base py-3.5 rounded-2xl shadow-xl transition cursor-pointer">
                Новый рейс
            </button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        // =========================================================================
        // 1. МАРШРУТ №32 КАЛИНИНГРАД И ГЕОМЕТРИЯ ИЗОГНУТОЙ ТРАССЫ
        // =========================================================================
        const ROUTE_STOPS = [
            { id: 0, name: 'Силикатный завод', speechName: 'Силикатный завод', z: -110, waiting: 7, landmark: 'factory' },
            { id: 1, name: 'Ул. Карташева', speechName: 'Улица Карташева', z: -380, waiting: 6, landmark: 'kartasheva' },
            { id: 2, name: 'Балтийское шоссе', speechName: 'Балтийское шоссе', z: -650, waiting: 5, landmark: 'baltiyskoye' },
            { id: 3, name: 'Центральный парк', speechName: 'Центральный парк', z: -930, waiting: 9, landmark: 'central_park' },
            { id: 4, name: 'Драмтеатр', speechName: 'Драмтеатр', z: -1210, waiting: 8, landmark: 'drama_theater' },
            { id: 5, name: 'Калининградский зоопарк', speechName: 'Калининградский зоопарк', z: -1490, waiting: 10, landmark: 'zoo' },
            { id: 6, name: 'Площадь Победы', speechName: 'Площадь Победы', z: -1780, waiting: 12, landmark: 'victory_square' },
            { id: 7, name: 'Литовский вал', speechName: 'Литовский вал', z: -2060, waiting: 7, landmark: 'kings_gate' },
            { id: 8, name: 'Ул. Гагарина', speechName: 'Улица Юрия Гагарина', z: -2340, waiting: 6, landmark: 'gagarina' },
            { id: 9, name: 'Ул. Артиллерийская', speechName: 'Улица Артиллерийская', z: -2620, waiting: 0, landmark: 'terminus' }
        ];

        const ROAD_WIDTH = 15.6;
        const HALF_ROAD = ROAD_WIDTH * 0.5;
        // Автобус стартует прямо на начальной остановке «Силикатный завод»
        const START_Z = -108;
        const END_Z = -2700;

        // Плавная кривая проспектов Калининграда
        function roadCenterX(z) {
            return 22 * Math.sin(z * 0.0024) + 11 * Math.sin(z * 0.0056 + 0.6);
        }
        function roadSlopeDXDZ(z) {
            return 22 * 0.0024 * Math.cos(z * 0.0024) + 11 * 0.0056 * Math.cos(z * 0.0056 + 0.6);
        }
        function roadAngle(z) {
            return Math.atan(roadSlopeDXDZ(z));
        }
        function roadPoint(z, lateralOffset) {
            const cx = roadCenterX(z);
            const a = roadAngle(z);
            return {
                x: cx + Math.cos(a) * lateralOffset,
                z: z - Math.sin(a) * lateralOffset,
                angle: a
            };
        }

        // =========================================================================
        // 2. ПРОЦЕДУРНЫЙ ЗВУК ДИЗЕЛЬНОГО АВТОБУСА, ПНЕВМАТИКИ И ГОНГА (WEB AUDIO API)
        // =========================================================================
        class BusAudioEngine {
            constructor() {
                this.ctx = null;
                this.started = false;
                this.muted = false;
                this.masterGain = null;
                this.oscMain = null;
                this.oscSub = null;
                this.engineFilter = null;
                this.engineGain = null;
                this.lastHissTime = 0;
            }

            start() {
                if (this.started) {
                    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
                    return;
                }
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AC();

                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = this.muted ? 0 : 1;
                    this.masterGain.connect(this.ctx.destination);

                    // Тяжёлый низкий дизель МАЗ-203 / ЛиАЗ-5292
                    this.oscMain = this.ctx.createOscillator();
                    this.oscSub = this.ctx.createOscillator();
                    this.oscMain.type = 'sawtooth';
                    this.oscSub.type = 'triangle';
                    this.oscMain.frequency.value = 42;
                    this.oscSub.frequency.value = 21;

                    this.engineFilter = this.ctx.createBiquadFilter();
                    this.engineFilter.type = 'lowpass';
                    this.engineFilter.frequency.value = 120;
                    this.engineFilter.Q.value = 1.6;

                    this.engineGain = this.ctx.createGain();
                    this.engineGain.gain.value = 0.058;

                    this.oscMain.connect(this.engineFilter);
                    this.oscSub.connect(this.engineFilter);
                    this.engineFilter.connect(this.engineGain);
                    this.engineGain.connect(this.masterGain);

                    this.oscMain.start();
                    this.oscSub.start();
                    this.started = true;
                } catch (e) {
                    console.warn('Web Audio unavailable:', e);
                }
            }

            setMuted(flag) {
                this.muted = flag;
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.setTargetAtTime(flag ? 0 : 1, this.ctx.currentTime, 0.05);
                }
            }

            // Передаём реальные нормализованные обороты (0..1) из 5-ступенчатой АКПП
            updateEngine(rpmNorm, throttle, gear) {
                if (!this.started || !this.ctx) return;
                const now = this.ctx.currentTime;
                const clampedRpm = Math.max(0, Math.min(1.1, rpmNorm));

                const baseFreq = 40 + clampedRpm * 58;
                this.oscMain.frequency.setTargetAtTime(baseFreq, now, 0.11);
                this.oscSub.frequency.setTargetAtTime(baseFreq * 0.5, now, 0.11);
                this.engineFilter.frequency.setTargetAtTime(110 + clampedRpm * 230 + (throttle && gear !== 'N' ? 40 : 0), now, 0.12);
                this.engineGain.gain.setTargetAtTime(0.05 + clampedRpm * 0.048, now, 0.12);
            }

            // Мягкий пшик пневматических тормозов или дверей
            playAirHiss(duration = 0.34, freq = 1450, volume = 0.11) {
                if (!this.started || !this.ctx || this.muted) return;
                const now = this.ctx.currentTime;
                if (now - this.lastHissTime < 0.25) return;
                this.lastHissTime = now;

                const size = Math.floor(this.ctx.sampleRate * duration);
                const buf = this.ctx.createBuffer(1, size, this.ctx.sampleRate);
                const ch = buf.getChannelData(0);
                for (let i = 0; i < size; i++) {
                    ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (size * 0.38));
                }
                const src = this.ctx.createBufferSource();
                src.buffer = buf;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(freq, now);
                filter.Q.value = 1.15;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(volume, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                src.connect(filter);
                filter.connect(gain);
                gain.connect(this.masterGain);
                src.start(now);
            }

            playDoorSound(opening) {
                this.lastHissTime = 0;
                this.playAirHiss(0.48, opening ? 1850 : 1320, 0.14);
                if (!opening && this.started && this.ctx && !this.muted) {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(860, now);
                    g.gain.setValueAtTime(0.045, now);
                    g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(g);
                    g.connect(this.masterGain);
                    osc.start(now);
                    osc.stop(now + 0.31);
                }
            }

            // Тёплый электронный 2- или 3-тоновый гонг автоинформатора «Калининград-ГорТранс»
            playInformatorChime(variant = 'arrival') {
                if (!this.started || !this.ctx || this.muted) return;
                const now = this.ctx.currentTime;
                // arrival: восходящий мягкий 3-тоновый (E5 -> G#5 -> B5), departure: спокойный 2-тоновый (A5 -> F#5)
                const notes = variant === 'departure'
                    ? [880.0, 739.99]
                    : variant === 'welcome'
                        ? [587.33, 739.99, 880.0]
                        : [659.25, 830.61, 987.77];

                notes.forEach((freq, idx) => {
                    const t0 = now + idx * 0.16;
                    const osc1 = this.ctx.createOscillator();
                    const osc2 = this.ctx.createOscillator();
                    osc1.type = 'sine';
                    osc2.type = 'triangle';
                    osc1.frequency.setValueAtTime(freq, t0);
                    osc2.frequency.setValueAtTime(freq * 2, t0);

                    const g1 = this.ctx.createGain();
                    const g2 = this.ctx.createGain();
                    g1.gain.setValueAtTime(0.0001, t0);
                    g1.gain.linearRampToValueAtTime(0.11, t0 + 0.018);
                    g1.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.48);

                    g2.gain.setValueAtTime(0.0001, t0);
                    g2.gain.linearRampToValueAtTime(0.025, t0 + 0.012);
                    g2.gain.exponentialRampToValueAtTime(0.0005, t0 + 0.25);

                    osc1.connect(g1);
                    osc2.connect(g2);
                    g1.connect(this.masterGain);
                    g2.connect(this.masterGain);

                    osc1.start(t0);
                    osc2.start(t0);
                    osc1.stop(t0 + 0.5);
                    osc2.stop(t0 + 0.28);
                });
            }

            playBoardChime() {
                if (!this.started || !this.ctx || this.muted) return;
                const now = this.ctx.currentTime;
                [1174.6, 1567.9].forEach((f, idx) => {
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now + idx * 0.07);
                    g.gain.setValueAtTime(0.04, now + idx * 0.07);
                    g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.15);
                    osc.connect(g);
                    g.connect(this.masterGain);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.16);
                });
            }
        }
        const busAudio = new BusAudioEngine();

        // =========================================================================
        // 3. АВТОИНФОРМАТОР КАЛИНИНГРАД-ГОРТРАНС (WEB SPEECH API + LED-ТАБЛО)
        // =========================================================================
        class BusInformator {
            constructor() {
                this.muted = false;
                this.voice = null;
                this.pillEl = null;
                this.textEl = null;
                this.hideTimer = null;
                this.speakTimer = null;
                this.lastAnnouncementText = '';
                this.reminderPlayed = false;

                if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
                    this.loadVoices();
                    window.speechSynthesis.onvoiceschanged = () => this.loadVoices();
                }
            }

            initDOM() {
                this.pillEl = document.getElementById('informator-pill');
                this.textEl = document.getElementById('informator-text');
            }

            loadVoices() {
                try {
                    const voices = window.speechSynthesis.getVoices();
                    if (!voices || !voices.length) return;
                    const ruVoices = voices.filter(v => (v.lang || '').toLowerCase().startsWith('ru'));
                    // Предпочитаем наиболее естественные системные русские голоса (Google, Milena, Yuri, Irina, Pavel)
                    this.voice =
                        ruVoices.find(v => /milena|google|irina|katya|yuri|pavel/i.test(v.name)) ||
                        ruVoices.find(v => v.lang.toLowerCase() === 'ru-ru') ||
                        ruVoices[0] ||
                        null;
                } catch (e) {
                    console.warn('Speech voices load warning:', e);
                }
            }

            // Разблокировка speechSynthesis при первом пользовательском нажатии («Поехали»)
            unlock() {
                if (!('speechSynthesis' in window)) return;
                try {
                    this.loadVoices();
                    window.speechSynthesis.cancel();
                    const silent = new SpeechSynthesisUtterance(' ');
                    silent.lang = 'ru-RU';
                    silent.volume = 0;
                    window.speechSynthesis.speak(silent);
                } catch (e) {
                    // Безопасный откат на визуальное табло
                }
            }

            setMuted(flag) {
                this.muted = flag;
                if (flag && 'speechSynthesis' in window) {
                    try { window.speechSynthesis.cancel(); } catch (e) {}
                }
            }

            showLed(text, durationMs) {
                if (!this.pillEl || !this.textEl) return;
                clearTimeout(this.hideTimer);
                this.textEl.textContent = text;
                this.pillEl.classList.remove('hidden-led');
                this.hideTimer = setTimeout(() => {
                    this.pillEl.classList.add('hidden-led');
                }, durationMs);
            }

            announce(text, chimeVariant = 'arrival') {
                this.lastAnnouncementText = text;
                clearTimeout(this.speakTimer);
                clearTimeout(this.hideTimer);

                const estReadMs = Math.max(4200, Math.min(11500, text.length * 76 + 1600));
                this.showLed(text, estReadMs);

                if (this.muted) return;

                busAudio.playInformatorChime(chimeVariant);

                if (!('speechSynthesis' in window)) return;

                const delayMs = chimeVariant === 'departure' ? 360 : 520;
                this.speakTimer = setTimeout(() => {
                    if (this.muted) return;
                    try {
                        window.speechSynthesis.cancel();
                        this.loadVoices();
                        const utt = new SpeechSynthesisUtterance(text);
                        utt.lang = 'ru-RU';
                        if (this.voice) utt.voice = this.voice;
                        utt.rate = 0.96;
                        utt.pitch = 1.0;
                        utt.volume = 1.0;
                        utt.onend = () => {
                            clearTimeout(this.hideTimer);
                            this.hideTimer = setTimeout(() => {
                                if (this.pillEl) this.pillEl.classList.add('hidden-led');
                            }, 1300);
                        };
                        window.speechSynthesis.speak(utt);
                    } catch (e) {
                        console.warn('TTS speak warning:', e);
                    }
                }, delayMs);
            }

            announceStart() {
                this.announce(
                    'Уважаемые пассажиры! Автобус следует по маршруту номер тридцать два: Силикатный завод — Улица Артиллерийская. Следующая остановка — Улица Карташева.',
                    'welcome'
                );
            }

            announceArrival(stop) {
                if (stop.id === ROUTE_STOPS.length - 1) {
                    this.announce(
                        'Конечная остановка: Улица Артиллерийская. Просьба освободить салон. Не забывайте свои вещи.',
                        'arrival'
                    );
                } else {
                    this.announce(`Остановка: ${stop.speechName}.`, 'arrival');
                }
            }

            announceDeparture(nextStop) {
                if (!nextStop) return;
                this.announce(
                    `Осторожно, двери закрываются. Следующая остановка — ${nextStop.speechName}.`,
                    'departure'
                );
            }

            announceReminder() {
                this.reminderPlayed = true;
                this.announce(
                    'Уважаемые пассажиры, оплачивайте проезд своевременно. Во время движения держитесь за поручни.',
                    'departure'
                );
            }

            replayCurrent(nextStop, inZoneStop) {
                if (inZoneStop) {
                    this.announceArrival(inZoneStop);
                } else if (nextStop) {
                    this.announce(`Следующая остановка — ${nextStop.speechName}.`, 'arrival');
                } else if (this.lastAnnouncementText) {
                    this.announce(this.lastAnnouncementText, 'arrival');
                }
            }
        }
        const informator = new BusInformator();

        // =========================================================================
        // 4. ПРОЦЕДУРНЫЕ CANVAS-ТЕКСТУРЫ (АСФАЛЬТ, ПЛИТКА, ФАСАДЫ, КРЫШИ, ТАБЛО)
        // =========================================================================
        const Textures = {};

        function makeCanvas(w, h) {
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            return { c, ctx: c.getContext('2d') };
        }

        function createProceduralTextures(maxAniso) {
            // 1. Асфальт с мелким зерном, трещинами и разметкой 4 полос
            {
                const { c, ctx } = makeCanvas(512, 512);
                ctx.fillStyle = '#333b48';
                ctx.fillRect(0, 0, 512, 512);

                for (let i = 0; i < 9000; i++) {
                    const shade = 38 + Math.floor(Math.random() * 34);
                    ctx.fillStyle = `rgb(${shade},${shade + 4},${shade + 10})`;
                    ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
                }

                [64, 192, 320, 448].forEach(lx => {
                    const g = ctx.createLinearGradient(lx - 28, 0, lx + 28, 0);
                    g.addColorStop(0, 'rgba(15,20,28,0)');
                    g.addColorStop(0.5, 'rgba(15,20,28,0.22)');
                    g.addColorStop(1, 'rgba(15,20,28,0)');
                    ctx.fillStyle = g;
                    ctx.fillRect(lx - 28, 0, 56, 512);
                });

                ctx.strokeStyle = 'rgba(15, 20, 28, 0.45)';
                ctx.lineWidth = 1.2;
                for (let k = 0; k < 6; k++) {
                    ctx.beginPath();
                    let sx = Math.random() * 512;
                    let sy = Math.random() * 512;
                    ctx.moveTo(sx, sy);
                    for (let s = 0; s < 5; s++) {
                        sx += (Math.random() - 0.5) * 45;
                        sy += (Math.random() - 0.5) * 45;
                        ctx.lineTo(sx, sy);
                    }
                    ctx.stroke();
                }

                ctx.fillStyle = 'rgba(241, 245, 249, 0.82)';
                ctx.fillRect(10, 0, 6, 512);
                ctx.fillRect(496, 0, 6, 512);

                ctx.fillStyle = 'rgba(248, 250, 252, 0.9)';
                ctx.fillRect(249, 0, 5, 512);
                ctx.fillRect(258, 0, 5, 512);

                ctx.fillStyle = 'rgba(241, 245, 249, 0.82)';
                for (let y = 20; y < 512; y += 128) {
                    ctx.fillRect(128, y, 5, 62);
                    ctx.fillRect(380, y, 5, 62);
                }

                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = THREE.ClampToEdgeWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.anisotropy = maxAniso;
                Textures.asphalt = tex;
            }

            // 2. Калининградская тротуарная плитка и брусчатка
            {
                const { c, ctx } = makeCanvas(256, 256);
                ctx.fillStyle = '#9ea6b2';
                ctx.fillRect(0, 0, 256, 256);
                const tileW = 32, tileH = 16;
                for (let y = 0; y < 256; y += tileH) {
                    const offset = ((y / tileH) % 2) * (tileW / 2);
                    for (let x = -tileW; x < 256 + tileW; x += tileW) {
                        const v = 148 + Math.floor(Math.random() * 24);
                        const tint = Math.random() > 0.8 ? 10 : 0;
                        ctx.fillStyle = `rgb(${v + tint},${v},${v - 4})`;
                        ctx.fillRect(x + offset + 1, y + 1, tileW - 2, tileH - 2);
                    }
                }
                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.anisotropy = maxAniso;
                Textures.sidewalk = tex;
            }

            // 3. Газонная трава
            {
                const { c, ctx } = makeCanvas(256, 256);
                ctx.fillStyle = '#4d7c3f';
                ctx.fillRect(0, 0, 256, 256);
                for (let i = 0; i < 3500; i++) {
                    const g = 105 + Math.floor(Math.random() * 45);
                    ctx.fillStyle = `rgb(${Math.floor(g * 0.58)},${g},${Math.floor(g * 0.45)})`;
                    ctx.fillRect(Math.random() * 256, Math.random() * 256, 3, 3);
                }
                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(30, 180);
                Textures.grass = tex;
            }

            // 4. Жёлтая зигзагообразная разметка автобусной остановки 1.17
            {
                const { c, ctx } = makeCanvas(128, 512);
                ctx.clearRect(0, 0, 128, 512);
                ctx.fillStyle = 'rgba(16, 185, 129, 0.22)';
                ctx.fillRect(8, 12, 112, 488);
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 10;
                ctx.lineJoin = 'miter';
                ctx.beginPath();
                ctx.moveTo(116, 16);
                for (let y = 16; y <= 496; y += 60) {
                    const x = ((y - 16) / 60) % 2 === 0 ? 114 : 22;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.fillStyle = '#facc15';
                ctx.fillRect(114, 12, 8, 488);
                const tex = new THREE.CanvasTexture(c);
                tex.anisotropy = maxAniso;
                Textures.busStopZone = tex;
            }

            // 5. Пешеходный переход (зебра)
            {
                const { c, ctx } = makeCanvas(512, 128);
                ctx.clearRect(0, 0, 512, 128);
                ctx.fillStyle = 'rgba(248, 250, 252, 0.88)';
                for (let x = 22; x < 490; x += 48) {
                    ctx.fillRect(x, 12, 26, 104);
                }
                const tex = new THREE.CanvasTexture(c);
                tex.anisotropy = maxAniso;
                Textures.crosswalk = tex;
            }

            // 6. Черепичная крыша Кёнигсберга
            {
                const { c, ctx } = makeCanvas(256, 256);
                ctx.fillStyle = '#9a3412';
                ctx.fillRect(0, 0, 256, 256);
                for (let y = 0; y < 256; y += 16) {
                    for (let x = 0; x < 256; x += 24) {
                        const r = 138 + Math.floor(Math.random() * 42);
                        ctx.fillStyle = `rgb(${r}, ${Math.floor(r * 0.36)}, ${Math.floor(r * 0.2)})`;
                        ctx.fillRect(x + 1, y + 1, 22, 14);
                    }
                }
                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(2, 2);
                Textures.roofTile = tex;
            }

            // 7. Фасады калининградских зданий
            function buildFacadeTexture(opts) {
                const { c, ctx } = makeCanvas(256, 256);
                ctx.fillStyle = opts.baseColor;
                ctx.fillRect(0, 0, 256, 256);

                if (opts.style === 'brick') {
                    for (let y = 0; y < 256; y += 10) {
                        const shift = ((y / 10) % 2) * 12;
                        for (let x = -12; x < 268; x += 24) {
                            const delta = Math.floor((Math.random() - 0.5) * 24);
                            ctx.fillStyle = opts.brickShade(delta);
                            ctx.fillRect(x + shift + 1, y + 1, 22, 8);
                        }
                    }
                } else if (opts.style === 'panel') {
                    ctx.strokeStyle = 'rgba(51, 65, 85, 0.25)';
                    ctx.lineWidth = 2;
                    for (let y = 0; y < 256; y += 64) {
                        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
                    }
                    for (let x = 0; x < 256; x += 64) {
                        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
                    }
                } else if (opts.style === 'fachwerk') {
                    ctx.fillStyle = '#452715';
                    for (let y = 0; y <= 256; y += 64) ctx.fillRect(0, y - 3, 256, 7);
                    for (let x = 0; x <= 256; x += 64) ctx.fillRect(x - 3, 0, 7, 256);
                    ctx.strokeStyle = '#452715';
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(0, 64); ctx.lineTo(64, 0);
                    ctx.moveTo(192, 0); ctx.lineTo(256, 64);
                    ctx.moveTo(0, 192); ctx.lineTo(64, 128);
                    ctx.moveTo(192, 128); ctx.lineTo(256, 192);
                    ctx.stroke();
                }

                const rows = opts.rows || 4;
                const cols = opts.cols || 4;
                const cellW = 256 / cols;
                const cellH = 256 / rows;

                for (let r = 0; r < rows; r++) {
                    for (let col = 0; col < cols; col++) {
                        const wx = col * cellW + cellW * 0.22;
                        const wy = r * cellH + cellH * 0.2;
                        const ww = cellW * 0.56;
                        const wh = cellH * 0.58;

                        ctx.fillStyle = opts.frameColor || '#f8fafc';
                        ctx.fillRect(wx - 2, wy - 2, ww + 4, wh + 4);

                        const warm = Math.random() > 0.78;
                        const grad = ctx.createLinearGradient(wx, wy, wx + ww, wy + wh);
                        if (warm) {
                            grad.addColorStop(0, '#fde68a');
                            grad.addColorStop(1, '#d97706');
                        } else {
                            grad.addColorStop(0, '#38bdf8');
                            grad.addColorStop(0.45, '#1e3a5f');
                            grad.addColorStop(1, '#0f172a');
                        }
                        ctx.fillStyle = grad;
                        ctx.fillRect(wx, wy, ww, wh);

                        ctx.fillStyle = opts.frameColor || '#e2e8f0';
                        ctx.fillRect(wx + ww * 0.47, wy, 2.5, wh);
                        ctx.fillRect(wx, wy + wh * 0.4, ww, 2.5);

                        ctx.fillStyle = '#cbd5e1';
                        ctx.fillRect(wx - 4, wy + wh + 1, ww + 8, 4);
                    }
                }

                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.anisotropy = maxAniso;
                return tex;
            }

            Textures.facadeRedBrick = buildFacadeTexture({
                baseColor: '#7c2d12',
                style: 'brick',
                brickShade: (d) => `rgb(${155 + d},${62 + Math.floor(d * 0.5)},${42 + Math.floor(d * 0.4)})`,
                frameColor: '#f8fafc',
                rows: 3, cols: 4
            });
            Textures.facadeFachwerk = buildFacadeTexture({
                baseColor: '#f5e6ca',

        function createStopSignTexture(name) {
            const { c, ctx } = makeCanvas(256, 96);
            ctx.fillStyle = '#065f46';
            ctx.fillRect(0, 0, 256, 96);
            ctx.fillStyle = '#facc15';
            ctx.fillRect(0, 0, 68, 96);
            ctx.fillStyle = '#0f172a';
            ctx.font = '900 38px Inter, sans-serif';
            ctx.fillText('32', 10, 62);
            ctx.fillStyle = '#ffffff';
            ctx.font = '700 20px Inter, sans-serif';
            const words = name.split(' ');
            if (words.length > 1) {
                ctx.fillText(words[0], 78, 40);
                ctx.fillText(words.slice(1).join(' ').slice(0, 15), 78, 70);
            } else {
                ctx.fillText(name.slice(0, 14), 78, 56);
            }
            return new THREE.CanvasTexture(c);
        }

        // =========================================================================
        // 5. СОСТОЯНИЕ ИГРЫ, РЕАЛИСТИЧНАЯ ФИЗИКА И КАМЕРА

        // Параметры 5-ступенчатой автоматической коробки передач (МАЗ-203 / ЛиАЗ-5292)

        const startPt = roadPoint(START_Z, HALF_ROAD - 2.2);

        const state = {

        // =========================================================================
        // 6. ИНИЦИАЛИЗАЦИЯ THREE.JS И ПОСТРОЕНИЕ 3D-МИРА
        // =========================================================================
        let scene, camera, renderer, clock, sunLight;
        let busGroup, busChassis, cabinWheelMesh;
        let frontWheelPivots = [], allWheelRollMeshes = [];
        let doorMeshes = [], brakeLightMats = [], reverseLightMats = [];
        let stopEntries = [];

        function initScene() {
            const canvas = document.getElementById('game-canvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;

            createProceduralTextures(maxAniso);

            // Тёплое балтийское солнце и мягкий небесный свет

            sunLight.shadow.camera.far = 190;

            buildSkyAndClouds();

        function buildSkyAndClouds() {
            const skyGeo = new THREE.SphereGeometry(370, 20, 14);
            const skyMat = new THREE.MeshBasicMaterial({ map: Textures.sky, side: THREE.BackSide, fog: false });
            const skyMesh = new THREE.Mesh(skyGeo, skyMat);
            skyMesh.name = 'skyDome';
            scene.add(skyMesh);

            const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.86, fog: false });
            const puffGeo = new THREE.DodecahedronGeometry(1, 1);

            for (let i = 0; i < 26; i++) {
                const group = new THREE.Group();
                const puffs = 3 + (i % 3);
                for (let p = 0; p < puffs; p++) {
                    const m = new THREE.Mesh(puffGeo, cloudMat);
                    const s = 6 + (p % 2) * 4 + (i % 4);
                    m.scale.set(s * 1.4, s * 0.55, s);
                    m.position.set((p - 1) * 7, (p % 2) * 1.6, (p % 3 - 1) * 3);
                    group.add(m);
                }
                const z = 100 - i * 115;
                group.position.set(roadCenterX(z) + ((i % 2 === 0 ? 1 : -1) * (40 + (i * 19) % 110)), 82 + (i % 4) * 10, z);
                scene.add(group);
                cloudMeshes.push(group);
            }
        }

        function buildCurvedRoadAndSidewalks() {
            const zStart = 50;
            const zEnd = -2780;
            const step = 8;
            const steps = Math.floor((zStart - zEnd) / step);

            function createRibbon(leftOffset, rightOffset, yHeight, uRepeat, vMetersPerTile, material, receiveShadow) {
                const positions = [];
                const uvs = [];
                const indices = [];

                for (let i = 0; i <= steps; i++) {
                    const z = zStart - i * step;
                    const pL = roadPoint(z, leftOffset);
                    const pR = roadPoint(z, rightOffset);

                    positions.push(pL.x, yHeight, pL.z);
                    positions.push(pR.x, yHeight, pR.z);

                    const v = (i * step) / vMetersPerTile;
                    uvs.push(0, v);
                    uvs.push(uRepeat, v);

                    if (i < steps) {
                        const base = i * 2;
                        indices.push(base, base + 1, base + 2);
                        indices.push(base + 1, base + 3, base + 2);
                    }
                }

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                geo.setIndex(indices);
                geo.computeVertexNormals();

                const mesh = new THREE.Mesh(geo, material);
                mesh.receiveShadow = receiveShadow;
                scene.add(mesh);
                return mesh;
            }

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(720, 3200),
                new THREE.MeshLambertMaterial({ map: Textures.grass })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.position.set(0, -0.06, -1350);
            ground.receiveShadow = true;
            scene.add(ground);

            createRibbon(-HALF_ROAD, HALF_ROAD, 0.01, 1, 16,
                new THREE.MeshLambertMaterial({ map: Textures.asphalt }), true);

            const swMat = new THREE.MeshLambertMaterial({ map: Textures.sidewalk });
            createRibbon(-HALF_ROAD - 4.8, -HALF_ROAD - 0.25, 0.18, 2, 4.5, swMat, true);
            createRibbon(HALF_ROAD + 0.25, HALF_ROAD + 4.8, 0.18, 2, 4.5, swMat, true);

            const curbMat = new THREE.MeshLambertMaterial({ color: 0xcbd5e1 });
            createRibbon(-HALF_ROAD - 0.25, -HALF_ROAD, 0.19, 1, 10, curbMat, false);
            createRibbon(HALF_ROAD, HALF_ROAD + 0.25, 0.19, 1, 10, curbMat, false);

            function createCurbWall(offsetX, flip) {
                const pos = [], idx = [];
                for (let i = 0; i <= steps; i++) {
                    const z = zStart - i * step;
                    const p = roadPoint(z, offsetX);
                    pos.push(p.x, 0.0, p.z);
                    pos.push(p.x, 0.19, p.z);
                    if (i < steps) {
                        const b = i * 2;
                        if (flip) idx.push(b, b + 2, b + 1, b + 1, b + 2, b + 3);
                        else idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2);
                    }
                }
                const g = new THREE.BufferGeometry();
                g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                g.setIndex(idx);
                g.computeVertexNormals();
                scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0x94a3b8 })));
            }
            createCurbWall(HALF_ROAD, false);
            createCurbWall(-HALF_ROAD, true);

            const cwMat = new THREE.MeshBasicMaterial({ map: Textures.crosswalk, transparent: true, depthWrite: false });
            const cwGeo = new THREE.PlaneGeometry(ROAD_WIDTH - 0.6, 3.8);
            ROUTE_STOPS.forEach((stop, idx) => {
                if (idx === 0 || idx === 9) return;
                const p = roadPoint(stop.z - 14, 0);
                const cw = new THREE.Mesh(cwGeo, cwMat);
                cw.rotation.x = -Math.PI / 2;
                cw.rotation.z = p.angle;
                cw.position.set(p.x, 0.03, p.z);
                scene.add(cw);
            });
        }

        function buildCityBuildingsAndLandmarks() {
            const matRedBrick = new THREE.MeshLambertMaterial({ map: Textures.facadeRedBrick });
            const matFachwerk = new THREE.MeshLambertMaterial({ map: Textures.facadeFachwerk });
            const matStalinka = new THREE.MeshLambertMaterial({ map: Textures.facadeStalinka });
            const matPanel = new THREE.MeshLambertMaterial({ map: Textures.facadePanel });
            const matModern = new THREE.MeshLambertMaterial({ map: Textures.facadeModern });
            const matFactory = new THREE.MeshLambertMaterial({ map: Textures.facadeFactory });
            const matRoofRed = new THREE.MeshLambertMaterial({ map: Textures.roofTile });
            const matRoofDark = new THREE.MeshLambertMaterial({ color: 0x334155 });
            const matBalcony = new THREE.MeshLambertMaterial({ color: 0xe2e8f0 });
            const matGlassModern = new THREE.MeshLambertMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.72 });

            function addHouse(z, side, style, seed) {
                const group = new THREE.Group();
                let w, h, d, wallMat;

                if (style === 'german') {
                    w = 9 + (seed % 5);
                    h = 7.5 + (seed % 4) * 1.4;
                    d = 12 + (seed % 5);
                    wallMat = (seed % 2 === 0) ? matRedBrick : matFachwerk;

                    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                    body.position.y = h * 0.5;
                    group.add(body);

                    const roofH = 4.2 + (seed % 2);
                    const roofGeo = new THREE.CylinderGeometry(0, w * 0.78, roofH, 4);
                    roofGeo.rotateY(Math.PI / 4);
                    const roof = new THREE.Mesh(roofGeo, matRoofRed);
                    roof.scale.set(1.02, 1, d / (w * 1.05));
                    roof.position.y = h + roofH * 0.5;
                    group.add(roof);

                    const dormer = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.8, 2.2), matFachwerk);
                    dormer.position.set(side < 0 ? w * 0.25 : -w * 0.25, h + 1.2, 0);
                    group.add(dormer);
                } else if (style === 'soviet') {
                    const isNineStory = (seed % 3 === 0);
                    w = 12 + (seed % 4);
                    h = isNineStory ? 23 : 14.5;
                    d = 18 + (seed % 6);
                    wallMat = (seed % 2 === 0) ? matPanel : matStalinka;

                    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                    body.position.y = h * 0.5;
                    group.add(body);

                    const cap = new THREE.Mesh(new THREE.BoxGeometry(w + 0.5, 0.7, d + 0.5), matRoofDark);
                    cap.position.y = h + 0.35;
                    group.add(cap);

                    const faceX = side < 0 ? w * 0.5 + 0.55 : -w * 0.5 - 0.55;
                    const floors = isNineStory ? 6 : 4;
                    for (let fl = 1; fl < floors; fl++) {
                        for (let bz = -d * 0.3; bz <= d * 0.31; bz += d * 0.3) {
                            const balc = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 3.2), matBalcony);
                            balc.position.set(faceX, fl * 3.1 + 1.4, bz);
                            group.add(balc);
                        }
                    }
                } else if (style === 'modern') {
                    w = 13 + (seed % 4);
                    h = 22 + (seed % 3) * 5;
                    d = 16 + (seed % 4);
                    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matModern);
                    body.position.y = h * 0.5;
                    group.add(body);

                    const accent = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, h * 0.88, d * 0.36), matGlassModern);
                    accent.position.y = h * 0.5;
                    group.add(accent);

                    const topRim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 1.1, d + 0.6), matRoofDark);
                    topRim.position.y = h + 0.55;
                    group.add(topRim);
                } else {
                    w = 15;
                    h = 9.5 + (seed % 3);
                    d = 22;
                    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matFactory);
                    body.position.y = h * 0.5;
                    group.add(body);

                    const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 0.8, d + 0.6), matRoofDark);
                    roof.position.y = h + 0.4;
                    group.add(roof);
                }

                const lateral = side * (HALF_ROAD + 7.5 + w * 0.5 + (seed % 5));
                const p = roadPoint(z, lateral);
                group.position.set(p.x, 0, p.z);
                group.rotation.y = p.angle;
                scene.add(group);
            }

            let seed = 1;
            for (let z = 10; z > -2720; z -= 26) {
                seed += 7;
                for (const side of [-1, 1]) {
                    if (z < -830 && z > -1040 && side === -1) continue;
                    if (z < -1160 && z > -1260 && side === 1) continue;
                    if (z < -1440 && z > -1550 && side === -1) continue;
                    if (z < -1710 && z > -1860 && side === -1) continue;
                    if (z < -2020 && z > -2110 && side === 1) continue;
                    if (z < -560 && z > -800 && (seed + side) % 3 !== 0) continue;

                    let style = 'german';
                    if (z > -250) {
                        style = (side === 1 || seed % 2 === 0) ? 'factory' : 'soviet';
                    } else if (z > -560) {
                        style = (seed % 3 === 0) ? 'soviet' : 'german';
                    } else if (z > -1640) {
                        style = (seed % 3 === 0) ? 'soviet' : 'german';
                    } else if (z > -2440) {
                        style = (seed % 2 === 0) ? 'soviet' : 'german';
                    } else {
                        style = (seed % 3 === 0) ? 'soviet' : 'modern';
                    }

                    addHouse(z + (side > 0 ? 6 : 0), side, style, seed + (side > 0 ? 3 : 0));
                }
            }

            buildLandmarks(matRedBrick, matRoofRed, matFactory, matStalinka);
        }

        function buildLandmarks(matRedBrick, matRoofRed, matFactory, matStalinka) {
            // 1. Силикатный завод (трубы и корпус)
            {
                const p = roadPoint(-115, HALF_ROAD + 19);
                const g = new THREE.Group();
                const hall = new THREE.Mesh(new THREE.BoxGeometry(16, 11, 30), matFactory);
                hall.position.y = 5.5;
                g.add(hall);
                [-8, 6].forEach((cz, idx) => {
                    const ch = new THREE.Mesh(
                        new THREE.CylinderGeometry(1.1, 1.9, 32 - idx * 5, 12),
                        new THREE.MeshLambertMaterial({ color: idx === 0 ? 0xc2410c : 0xdc2626 })
                    );
                    ch.position.set(5, (32 - idx * 5) * 0.5, cz);
                    const stripe = new THREE.Mesh(
                        new THREE.CylinderGeometry(1.25, 1.35, 3.2, 12),
                        new THREE.MeshLambertMaterial({ color: 0xf8fafc })
                    );
                    stripe.position.set(5, 24 - idx * 4, cz);
                    g.add(ch, stripe);
                });
                g.position.set(p.x, 0, p.z);
                g.rotation.y = p.angle;
                scene.add(g);
            }

            // 2. Центральный парк — Кирха Королевы Луизы
            {
                const p = roadPoint(-935, -(HALF_ROAD + 17));
                const g = new THREE.Group();
                const nave = new THREE.Mesh(new THREE.BoxGeometry(12, 12, 22), matRedBrick);
                nave.position.y = 6;
                const roof = new THREE.Mesh(new THREE.ConeGeometry(9.5, 6.5, 4), matRoofRed);
                roof.rotation.y = Math.PI / 4;
                roof.scale.set(0.95, 1, 1.7);
                roof.position.y = 15.2;

                const tower = new THREE.Mesh(new THREE.BoxGeometry(5.8, 22, 5.8), matRedBrick);
                tower.position.set(3.5, 11, 8);
                const spire = new THREE.Mesh(
                    new THREE.ConeGeometry(3.9, 13, 4),
                    new THREE.MeshLambertMaterial({ color: 0x115e59 })
                );
                spire.rotation.y = Math.PI / 4;
                spire.position.set(3.5, 28.5, 8);
                g.add(nave, roof, tower, spire);
                g.position.set(p.x, 0, p.z);
                g.rotation.y = p.angle;
                scene.add(g);
            }

            // 3. Драмтеатр с белыми колоннами
            {
                const p = roadPoint(-1210, HALF_ROAD + 19);
                const g = new THREE.Group();
                const main = new THREE.Mesh(new THREE.BoxGeometry(16, 13, 28), matStalinka);
                main.position.y = 6.5;
                g.add(main);

                const whiteMat = new THREE.MeshLambertMaterial({ color: 0xf8fafc });
                const steps = new THREE.Mesh(new THREE.BoxGeometry(4.5, 1.2, 20), whiteMat);
                steps.position.set(-9.5, 0.6, 0);
                g.add(steps);

                for (let cz = -7.5; cz <= 7.6; cz += 3) {
                    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.52, 10.5, 10), whiteMat);
                    col.position.set(-9.5, 6.2, cz);
                    g.add(col);
                }
                const pediment = new THREE.Mesh(new THREE.BoxGeometry(4.8, 2.2, 19), whiteMat);
                pediment.position.set(-9.4, 12.2, 0);
                g.add(pediment);

                g.position.set(p.x, 0, p.z);
                g.rotation.y = p.angle;
                scene.add(g);
            }

            // 4. Калининградский зоопарк — входная арка
            {
                const p = roadPoint(-1490, -(HALF_ROAD + 12));
                const g = new THREE.Group();
                const archBrick = new THREE.MeshLambertMaterial({ color: 0xb45309 });
                [-5.5, 5.5].forEach(az => {
                    const pil = new THREE.Mesh(new THREE.BoxGeometry(3.4, 8.8, 3.4), archBrick);
                    pil.position.set(0, 4.4, az);
                    g.add(pil);
                });
                const beam = new THREE.Mesh(
                    new THREE.BoxGeometry(2.6, 2.5, 14.8),
                    new THREE.MeshLambertMaterial({ color: 0xfde68a })
                );
                beam.position.set(0, 9.5, 0);
                g.add(beam);
                g.position.set(p.x, 0, p.z);
                g.rotation.y = p.angle;

        function buildInstancedVegetationAndLamps() {
            const broadleafCoords = [];
            const coniferCoords = [];
            const bushCoords = [];
            const lampCoords = [];

            for (let z = 30; z > -2740; z -= 11) {
                const nearStop = ROUTE_STOPS.some(s => Math.abs(s.z - z) < 16);

                if (Math.abs(Math.round(z)) % 33 < 11) {
                    lampCoords.push({ z, side: -1 });
                    lampCoords.push({ z, side: 1 });
                }

                for (const side of [-1, 1]) {
                    if (side === 1 && nearStop) continue;

                    const isPineZone = (z > -820 && z < -250);
                    const isParkZone = (z < -810 && z > -1080 && side === -1);

                    if (Math.abs(z * 13 + side) % 2 === 0 || isParkZone) {
                        const lat = side * (HALF_ROAD + 5.6 + ((Math.abs(z) * 7) % 10) * 0.14);
                        const item = { z: z + (side * 2.5), lat, scale: 0.85 + ((Math.abs(z * 17) % 10) * 0.045) };
                        if (isPineZone && Math.abs(z) % 3 !== 0) coniferCoords.push(item);
                        else broadleafCoords.push(item);
                    }

                    if (!nearStop && Math.abs(z) % 22 < 11) {
                        bushCoords.push({
                            z: z + 4,
                            lat: side * (HALF_ROAD + 5.1),
                            scale: 0.75 + ((Math.abs(z * 5) % 6) * 0.12)
                        });
                    }

                    if (isParkZone || (z < -520 && z > -820) || (z < -1410 && z > -1590 && side === -1)) {
                        for (let row = 0; row < 2; row++) {
                            const deepLat = side * (HALF_ROAD + 11 + row * 8 + ((Math.abs(z * 11 + row * 7) % 6)));
                            const item = { z: z + row * 4, lat: deepLat, scale: 1.0 + ((Math.abs(z + row) % 5) * 0.12) };
                            if (isPineZone && row === 1) coniferCoords.push(item);
                            else broadleafCoords.push(item);
                        }
                    }
                }
            }

            const dummy = new THREE.Object3D();
            const tmpColor = new THREE.Color();

            const bCount = broadleafCoords.length;
            const trunkGeo = new THREE.CylinderGeometry(0.22, 0.34, 3.2, 6);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c4033 });
            const leafGeo = new THREE.IcosahedronGeometry(2.1, 1);
            const leafMat = new THREE.MeshLambertMaterial({ color: 0xffffff });

            const trunkInst = new THREE.InstancedMesh(trunkGeo, trunkMat, bCount);
            const crown1Inst = new THREE.InstancedMesh(leafGeo, leafMat, bCount);
            const crown2Inst = new THREE.InstancedMesh(leafGeo, leafMat, bCount);
            const crown3Inst = new THREE.InstancedMesh(leafGeo, leafMat, bCount);

            const greenPalette = [0x2e7d32, 0x388e3c, 0x43a047, 0x4d7c0f, 0x15803d, 0x65a30d];

            broadleafCoords.forEach((t, i) => {
                const p = roadPoint(t.z, t.lat);
                const s = t.scale;

                dummy.position.set(p.x, 1.6 * s, p.z);
                dummy.rotation.set(0, (i * 1.3) % 6.28, 0);
                dummy.scale.set(s, s, s);
                dummy.updateMatrix();
                trunkInst.setMatrixAt(i, dummy.matrix);

                dummy.position.set(p.x, 4.3 * s, p.z);
                dummy.scale.set(s * 1.15, s * 0.92, s * 1.15);
                dummy.updateMatrix();
                crown1Inst.setMatrixAt(i, dummy.matrix);

                dummy.position.set(p.x + 0.55 * s, 5.7 * s, p.z - 0.35 * s);
                dummy.scale.set(s * 0.85, s * 0.82, s * 0.85);
                dummy.updateMatrix();
                crown2Inst.setMatrixAt(i, dummy.matrix);

                dummy.position.set(p.x - 0.75 * s, 4.7 * s, p.z + 0.55 * s);
                dummy.scale.set(s * 0.78, s * 0.75, s * 0.78);
                dummy.updateMatrix();
                crown3Inst.setMatrixAt(i, dummy.matrix);

                tmpColor.setHex(greenPalette[i % greenPalette.length]);
                crown1Inst.setColorAt(i, tmpColor);
                tmpColor.offsetHSL(0.015, 0.04, 0.05);
                crown2Inst.setColorAt(i, tmpColor);
                tmpColor.offsetHSL(-0.02, -0.02, -0.04);
                crown3Inst.setColorAt(i, tmpColor);
            });
            crown1Inst.instanceColor.needsUpdate = true;
            crown2Inst.instanceColor.needsUpdate = true;
            crown3Inst.instanceColor.needsUpdate = true;
            scene.add(trunkInst, crown1Inst, crown2Inst, crown3Inst);

            const cCount = coniferCoords.length;
            if (cCount > 0) {
                const cTrunkInst = new THREE.InstancedMesh(trunkGeo, trunkMat, cCount);
                const coneGeo = new THREE.ConeGeometry(2.0, 5.2, 7);
                const pineMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
                const coneLow = new THREE.InstancedMesh(coneGeo, pineMat, cCount);
                const coneTop = new THREE.InstancedMesh(coneGeo, pineMat, cCount);

                const pineColors = [0x14532d, 0x166534, 0x1e4620];
                coniferCoords.forEach((t, i) => {
                    const p = roadPoint(t.z, t.lat);
                    const s = t.scale;

                    dummy.position.set(p.x, 1.6 * s, p.z);
                    dummy.rotation.set(0, i, 0);
                    dummy.scale.set(s * 0.85, s * 1.1, s * 0.85);
                    dummy.updateMatrix();
                    cTrunkInst.setMatrixAt(i, dummy.matrix);

                    dummy.position.set(p.x, 4.6 * s, p.z);
                    dummy.scale.set(s * 1.1, s * 1.0, s * 1.1);
                    dummy.updateMatrix();
                    coneLow.setMatrixAt(i, dummy.matrix);

                    dummy.position.set(p.x, 7.2 * s, p.z);
                    dummy.scale.set(s * 0.78, s * 0.9, s * 0.78);
                    dummy.updateMatrix();
                    coneTop.setMatrixAt(i, dummy.matrix);

                    tmpColor.setHex(pineColors[i % pineColors.length]);
                    coneLow.setColorAt(i, tmpColor);
                    tmpColor.offsetHSL(0, 0, 0.04);
                    coneTop.setColorAt(i, tmpColor);
                });
                coneLow.instanceColor.needsUpdate = true;
                coneTop.instanceColor.needsUpdate = true;
                scene.add(cTrunkInst, coneLow, coneTop);
            }

            if (bushCoords.length > 0) {
                const bushGeo = new THREE.DodecahedronGeometry(0.85, 1);
                const bushInst = new THREE.InstancedMesh(bushGeo, leafMat, bushCoords.length);
                bushCoords.forEach((b, i) => {
                    const p = roadPoint(b.z, b.lat);
                    dummy.position.set(p.x, 0.55 * b.scale, p.z);
                    dummy.rotation.set(0, i * 0.9, 0);
                    dummy.scale.set(b.scale * 1.35, b.scale * 0.78, b.scale * 1.2);
                    dummy.updateMatrix();
                    bushInst.setMatrixAt(i, dummy.matrix);
                    tmpColor.setHex(greenPalette[(i + 2) % greenPalette.length]);
                    bushInst.setColorAt(i, tmpColor);
                });
                bushInst.instanceColor.needsUpdate = true;
                scene.add(bushInst);
            }

            if (lampCoords.length > 0) {
                const poleGeo = new THREE.CylinderGeometry(0.08, 0.13, 7.6, 6);
                const poleMat = new THREE.MeshLambertMaterial({ color: 0x475569 });
                const headGeo = new THREE.BoxGeometry(1.3, 0.18, 0.36);
                const headMat = new THREE.MeshBasicMaterial({ color: 0xfef9c3 });

                const poleInst = new THREE.InstancedMesh(poleGeo, poleMat, lampCoords.length);
                const headInst = new THREE.InstancedMesh(headGeo, headMat, lampCoords.length);

                lampCoords.forEach((l, i) => {
                    const p = roadPoint(l.z, l.side * (HALF_ROAD + 0.85));
                    dummy.position.set(p.x, 3.8, p.z);
                    dummy.rotation.set(0, p.angle, 0);
                    dummy.scale.set(1, 1, 1);
                    dummy.updateMatrix();
                    poleInst.setMatrixAt(i, dummy.matrix);

                    const pHead = roadPoint(l.z, l.side * (HALF_ROAD + 0.25));
                    dummy.position.set(pHead.x, 7.55, pHead.z);
                    dummy.rotation.set(0, p.angle, 0);
                    dummy.updateMatrix();
                    headInst.setMatrixAt(i, dummy.matrix);
                });
                scene.add(poleInst, headInst);
            }
        }

        function buildBusStopsAndPassengers() {
            const frameMat = new THREE.MeshLambertMaterial({ color: 0x065f46 });
            const glassMat = new THREE.MeshLambertMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.42 });
            const benchMat = new THREE.MeshLambertMaterial({ color: 0xb45309 });
